<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Chat · 文件式输出客户端</title>
<style>
*{box-sizing:border-box;}
:root{
  --bg:#ffffff; --bg-soft:#f7f7f8; --bg-side:#f9f9fa; --border:#e6e6e8;
  --text:#16181d; --muted:#8a8f98; --accent:#4d6bfe; --accent-soft:#eef1ff;
  --code-bg:#fafafb;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font); font-size:15px; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

/* ============ 侧边栏 ============ */
.sidebar{
  width:260px;flex:0 0 260px;background:var(--bg-side);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .22s ease;z-index:60;
}
.sidebar.collapsed{margin-left:-260px;}
.sidebar-head{padding:12px;}
.new-chat{
  width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border-radius:10px;border:1px solid var(--border);background:#fff;
  color:var(--text);font-size:14px;font-weight:500;transition:.15s;
}
.new-chat:hover{background:var(--accent-soft);border-color:#c7d2fe;color:var(--accent);}
.conv-list{flex:1;overflow-y:auto;padding:4px 8px;}
.conv-item{
  display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;
  font-size:13.5px;color:#3f4451;cursor:pointer;margin-bottom:2px;user-select:none;
}
.conv-item:hover{background:rgba(0,0,0,.045);}
.conv-item.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07);font-weight:500;color:var(--text);}
.conv-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conv-del{
  opacity:0;border:none;background:transparent;color:var(--muted);
  font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;flex:0 0 auto;transition:.15s;
}
.conv-item:hover .conv-del{opacity:1;}
.conv-del:hover{background:rgba(0,0,0,.08);color:#e5484d;}
.sidebar-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;}
.side-btn{
  flex:1;padding:8px;border-radius:9px;border:none;background:transparent;
  font-size:12.5px;color:var(--muted);transition:.15s;
}
.side-btn:hover{background:rgba(0,0,0,.05);color:var(--text);}
.sidebar-mask{display:none;}

/* ============ 主区 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg);}
.topbar{
  height:54px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--border);background:rgba(255,255,255,.88);
  backdrop-filter:blur(8px);z-index:10;
}
.icon-btn{
  border:none;background:transparent;font-size:17px;color:var(--muted);
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--text);}
.topbar-title{font-size:14.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.model-badge{
  font-size:12px;color:var(--muted);background:var(--bg-soft);border:1px solid var(--border);
  padding:4px 10px;border-radius:20px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ============ 消息区 ============ */
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 18px 10px;}
.messages::-webkit-scrollbar{width:8px;}
.messages::-webkit-scrollbar-thumb{background:#d8d8dc;border-radius:4px;}
.messages::-webkit-scrollbar-thumb:hover{background:#c0c0c6;}
.messages::-webkit-scrollbar-track{background:transparent;}

.msg{display:flex;gap:12px;max-width:820px;margin:0 auto 24px;align-items:flex-start;}
.msg.user{flex-direction:row-reverse;}
.avatar{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:600;color:#fff;user-select:none;
}
.msg.user .avatar{background:#1f2937;}
.msg.assistant .avatar{background:linear-gradient(135deg,#4d6bfe,#7c3aed);}
.content{min-width:0;flex:1 1 auto;}
.msg.user .content{flex:0 1 auto;max-width:85%;display:flex;flex-direction:column;align-items:flex-end;}
.bubble{
  background:var(--bg-soft);border:1px solid var(--border);padding:10px 14px;border-radius:14px;
  white-space:pre-wrap;word-break:break-word;line-height:1.65;max-width:100%;
}

/* Markdown */
.md{line-height:1.75;word-wrap:break-word;overflow-wrap:anywhere;}
.md p{margin:0 0 12px;}
.md p:last-child{margin-bottom:0;}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:18px 0 10px;line-height:1.4;font-weight:600;}
.md h1{font-size:20px;} .md h2{font-size:17.5px;} .md h3{font-size:16px;}
.md h4,.md h5,.md h6{font-size:15px;}
.md ul,.md ol{margin:0 0 12px;padding-left:22px;}
.md li{margin:4px 0;}
.md blockquote{border-left:3px solid var(--border);margin:0 0 12px;padding:2px 0 2px 14px;color:var(--muted);}
.md a{color:var(--accent);text-decoration:none;}
.md a:hover{text-decoration:underline;}
.md hr{border:none;border-top:1px solid var(--border);margin:18px 0;}
.md img{max-width:100%;border-radius:8px;}
.md :not(pre) > code{
  background:rgba(0,0,0,.06);padding:2px 6px;border-radius:5px;
  font-size:.88em;font-family:var(--mono);color:#c7254e;
}
.cursor{
  display:inline-block;width:7px;height:15px;background:var(--accent);border-radius:2px;
  margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2,start) infinite;
}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

.msg-actions{display:flex;gap:2px;margin-top:8px;opacity:.5;transition:opacity .15s;}
.msg:hover .msg-actions{opacity:1;}
.msg-actions button{
  border:none;background:transparent;color:var(--muted);font-size:12px;
  padding:4px 9px;border-radius:7px;transition:.15s;
}
.msg-actions button:hover{background:rgba(0,0,0,.06);color:var(--text);}

/* ============ 文件卡片（核心） ============ */
.file-card{
  border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:12px 0;
  background:#fff;max-width:100%;box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.file-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f7f7f9;border-bottom:1px solid var(--border);}
.file-icon{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.file-info{min-width:0;flex:1;}
.file-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);}
.file-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.file-actions{margin-left:auto;display:flex;gap:3px;flex:0 0 auto;}
.fc-btn{
  border:none;background:transparent;padding:5px 9px;border-radius:7px;
  font-size:12px;color:var(--muted);transition:.15s;white-space:nowrap;
}
.fc-btn:hover{background:rgba(0,0,0,.07);color:var(--text);}
.fc-btn[data-act="preview"]{color:var(--accent);font-weight:500;background:var(--accent-soft);}
.fc-btn[data-act="preview"]:hover{background:#e0e6ff;}

.file-body{
  position:relative;background:var(--code-bg);max-height:340px;overflow:hidden;
  transition:max-height .3s ease;
}
.file-body.expanded{max-height:none;}
.file-body:not(.expanded)::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:70px;
  background:linear-gradient(to bottom,rgba(250,250,251,0),var(--code-bg));
  pointer-events:none;
}
.file-body pre{
  margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--mono);
  font-size:12.5px;line-height:1.65;tab-size:2;
  -webkit-overflow-scrolling:touch;
}
.file-body pre code{font-family:inherit;color:#24292f;white-space:pre;}
.file-toggle{
  width:100%;border:none;border-top:1px solid var(--border);background:#f7f7f9;
  padding:8px;font-size:12px;color:var(--muted);transition:.15s;
}
.file-toggle:hover{background:#f0f0f3;color:var(--text);}
.file-preview{border-top:1px solid var(--border);height:min(440px,55vh);background:#fff;}
.file-preview iframe{width:100%;height:100%;border:0;display:block;background:#fff;}

/* ============ 空状态 ============ */
.empty{max-width:820px;margin:0 auto;text-align:center;padding:56px 20px;}
.empty-logo{font-size:34px;color:var(--accent);}
.empty h2{font-size:21px;margin:16px 0 8px;font-weight:600;}
.empty p{color:var(--muted);font-size:13.5px;margin:0 0 22px;line-height:1.7;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chip{
  border:1px solid var(--border);background:#fff;border-radius:20px;
  padding:8px 15px;font-size:13px;color:#3f4451;transition:.15s;
}
.chip:hover{border-color:#c7d2fe;background:var(--accent-soft);color:var(--accent);}

/* ============ 输入区 ============ */
.composer{flex:0 0 auto;padding:8px 18px 14px;background:#fff;}
.composer-inner{
  max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
  border:1px solid var(--border);border-radius:16px;background:#fff;
  padding:8px 8px 8px 14px;box-shadow:0 2px 12px rgba(0,0,0,.04);
  transition:border-color .15s,box-shadow .15s;
}
.composer-inner:focus-within{border-color:#b9c4ff;box-shadow:0 0 0 3px rgba(77,107,254,.09);}
#input{
  flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:15px;
  line-height:1.6;max-height:180px;padding:5px 0;background:transparent;color:var(--text);
}
#input::placeholder{color:#a8adb8;}
.send-btn,.stop-btn{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;border:none;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.send-btn{background:var(--accent);color:#fff;}
.send-btn:hover{background:#3d59e8;}
.send-btn:disabled{background:#d5d9e5;cursor:not-allowed;}
.stop-btn{background:#f1f2f4;color:#e5484d;font-size:13px;}
.stop-btn:hover{background:#ffe9ea;}
.composer-tip{text-align:center;font-size:11.5px;color:#b3b7c0;margin-top:9px;}

/* ============ 错误提示 ============ */
.error-box{
  max-width:820px;margin:0 auto 24px;padding:12px 16px;border-radius:12px;
  background:#fff5f5;border:1px solid #ffd9d9;color:#b42318;font-size:13.5px;line-height:1.65;
}
.error-box strong{display:block;margin-bottom:4px;font-size:13.5px;}

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,18,26,.45);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-mask.show{display:flex;}
.modal{
  width:100%;max-width:470px;background:#fff;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden;animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:16px;}
.modal-close{border:none;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:0 4px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;max-height:62vh;overflow-y:auto;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;font-weight:500;color:#374151;}
.field input,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  font-size:14px;font-family:inherit;outline:none;transition:.15s;background:#fff;color:var(--text);
}
.field input:focus,.field textarea:focus{border-color:#b9c4ff;box-shadow:0 0 0 3px rgba(77,107,254,.1);}
.field textarea{resize:vertical;min-height:72px;line-height:1.55;}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.65;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);background:#fafafa;}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:500;}
.btn-primary:hover{background:#3d59e8;}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);padding:9px 18px;border-radius:9px;font-size:14px;}
.btn-ghost:hover{background:#f5f5f6;}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);
  background:rgba(22,24,29,.92);color:#fff;padding:9px 17px;border-radius:10px;
  font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:300;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ 响应式 ============ */
@media (max-width:820px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;
    transform:translateX(-100%);transition:transform .24s ease;
    box-shadow:0 0 40px rgba(0,0,0,.15);margin-left:0 !important;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-mask{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transition:.24s;z-index:55;
  }
  .sidebar-mask.show{opacity:1;pointer-events:auto;}
  .messages{padding:18px 12px 6px;}
  .msg{gap:9px;margin-bottom:20px;}
  .composer{padding:8px 12px 12px;}
  .file-preview{height:min(360px,50vh);}
  .model-badge{display:none;}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-chat" id="newChatBtn">＋ 新建对话</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-foot">
      <button class="side-btn" id="settingsBtn">⚙️ 设置</button>
      <button class="side-btn" id="clearAllBtn">🗑 清空全部</button>
    </div>
  </aside>
  <div class="sidebar-mask" id="sidebarMask"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" title="侧边栏">☰</button>
      <div class="topbar-title" id="topbarTitle">新对话</div>
      <span class="model-badge" id="modelBadge">-</span>
    </header>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
        </button>
        <button class="stop-btn" id="stopBtn" title="停止生成" style="display:none">■</button>
      </div>
      <div class="composer-tip">内容由 AI 生成，请注意甄别</div>
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <h3>设置</h3>
      <button class="modal-close" id="modalCloseBtn">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>API 地址（Base URL）</label>
        <input id="setBaseUrl" placeholder="https://api.openai.com/v1" spellcheck="false">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="setApiKey" type="password" placeholder="sk-..." spellcheck="false">
      </div>
      <div class="field">
        <label>模型名称</label>
        <input id="setModel" placeholder="gpt-4o-mini" spellcheck="false">
      </div>
      <div class="field">
        <label>系统提示词（可选）</label>
        <textarea id="setSystem" placeholder="例如：你是一个资深前端工程师…"></textarea>
      </div>
      <div class="field">
        <label>温度（0 ~ 2）</label>
        <input id="setTemp" type="number" min="0" max="2" step="0.1" placeholder="0.7">
      </div>
      <p class="hint">
        支持任何 <b>OpenAI 兼容</b> 接口：OpenAI / DeepSeek / Moonshot / 通义千问 / 智谱 / 硅基流动 / 本地 Ollama 等。<br>
        配置只保存在你自己的浏览器 localStorage 中。
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="btnCancel">取消</button>
      <button class="btn-primary" id="btnSaveSettings">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
 *  常量 & 工具
 * ============================================================ */
const STORAGE_KEY  = 'ai_chat_app_v1';
const SETTINGS_KEY = 'ai_chat_settings_v1';
const DEFAULT_SETTINGS = {
  baseUrl: 'https://api.openai.com/v1',
  apiKey: '',
  model: 'gpt-4o-mini',
  systemPrompt: '',
  temperature: 0.7
};

const LANG_NAMES = {
  html:'HTML', htm:'HTML', xml:'XML', svg:'SVG', css:'CSS', scss:'SCSS', less:'Less',
  js:'JavaScript', javascript:'JavaScript', jsx:'JSX', mjs:'JavaScript',
  ts:'TypeScript', typescript:'TypeScript', tsx:'TSX',
  json:'JSON', jsonc:'JSON', yaml:'YAML', yml:'YAML', toml:'TOML', ini:'INI',
  md:'Markdown', markdown:'Markdown', mdx:'MDX',
  py:'Python', python:'Python', java:'Java', c:'C', h:'C', cpp:'C++', cc:'C++', cxx:'C++',
  cs:'C#', csharp:'C#', go:'Go', golang:'Go', rust:'Rust', rs:'Rust',
  php:'PHP', ruby:'Ruby', rb:'Ruby', swift:'Swift', kotlin:'Kotlin', kt:'Kotlin',
  scala:'Scala', dart:'Dart', lua:'Lua', r:'R', perl:'Perl', pl:'Perl',
  sh:'Shell', bash:'Bash', shell:'Shell', zsh:'Shell', powershell:'PowerShell', ps1:'PowerShell',
  sql:'SQL', vue:'Vue', svelte:'Svelte', dockerfile:'Dockerfile', makefile:'Makefile',
  diff:'Diff', patch:'Diff', text:'纯文本', plaintext:'纯文本', txt:'纯文本'
};
const EXT_MAP = {
  html:'html', htm:'html', xml:'xml', svg:'svg', css:'css', scss:'scss', less:'less',
  js:'js', javascript:'js', jsx:'jsx', mjs:'mjs', ts:'ts', typescript:'ts', tsx:'tsx',
  json:'json', yaml:'yml', yml:'yml', toml:'toml', ini:'ini',
  md:'md', markdown:'md', py:'py', python:'py', java:'java', c:'c', cpp:'cpp', cs:'cs',
  go:'go', rust:'rs', rs:'rs', php:'php', ruby:'rb', rb:'rb', swift:'swift',
  kotlin:'kt', kt:'kt', scala:'scala', dart:'dart', lua:'lua', r:'r', perl:'pl',
  sh:'sh', bash:'sh', shell:'sh', zsh:'sh', powershell:'ps1',
  sql:'sql', vue:'vue', svelte:'svelte', diff:'diff'
};

const el = id => document.getElementById(id);
const messagesEl   = el('messages');
const inputEl      = el('input');
const sendBtn      = el('sendBtn');
const stopBtn      = el('stopBtn');
const convListEl   = el('convList');
const sidebarEl    = el('sidebar');
const sidebarMask  = el('sidebarMask');
const topbarTitle  = el('topbarTitle');
const modelBadge   = el('modelBadge');
const settingsModal= el('settingsModal');
const toastEl      = el('toast');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    return true;
  }catch(e){ return false; }
}

function downloadText(text, filename){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'code.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function formatBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}

function joinUrl(base, path){
  return String(base || '').replace(/\/+$/, '') + path;
}

/* ============================================================
 *  Markdown 渲染（自研轻量实现，无外部依赖）
 * ============================================================ */

/* 行内元素 */
function inline(text){
  const codes = [];
  let s = escapeHtml(text);

  // 保护行内代码
  s = s.replace(/`([^`\n]+)`/g, (m, p1) => {
    codes.push(p1);
    return '\u0001' + (codes.length - 1) + '\u0001';
  });

  // 图片
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,
    '<img alt="$1" src="$2" loading="lazy">');
  // 链接
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // 加粗
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  // 斜体
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  // 删除线
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

  // 还原行内代码
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + codes[+i] + '</code>');
  return s;
}

/* 文本块 → HTML */
function renderText(text){
  if(!text || !text.trim()) return '';
  const lines = text.split('\n');
  let html = '';
  let i = 0;
  let para = [];

  const flushPara = () => {
    if(para.length){
      html += '<p>' + para.map(inline).join('<br>') + '</p>';
      para = [];
    }
  };

  while(i < lines.length){
    const raw = lines[i];
    const t = raw.trim();

    if(!t){ flushPara(); i++; continue; }

    // 标题
    let m = t.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      flushPara();
      const lvl = m[1].length;
      html += '<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>';
      i++; continue;
    }

    // 分割线
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flushPara(); html += '<hr>'; i++; continue; }

    // 引用
    if(/^>\s?/.test(t)){
      flushPara();
      const q = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){
        q.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      html += '<blockquote>' + renderText(q.join('\n')) + '</blockquote>';
      continue;
    }

    // 无序列表
    if(/^[-*+]\s+/.test(t)){
      flushPara();
      const items = [];
      while(i < lines.length && /^\s*[-*+]\s+/.test(lines[i].trim())){
        items.push(lines[i].trim().replace(/^[-*+]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>';
      continue;
    }

    // 有序列表
    if(/^\d+[.)]\s+/.test(t)){
      flushPara();
      const items = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i].trim())){
        items.push(lines[i].trim().replace(/^\d+[.)]\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(x => '<li>' + inline(x) + '</li>').join('') + '</ol>';
      continue;
    }

    para.push(t);
    i++;
  }
  flushPara();
  return html;
}

/* 切分代码围栏 */
function splitFences(md){
  const lines = md.split('\n');
  const out = [];
  let buf = [];
  let i = 0;

  const flush = () => {
    if(buf.length){ out.push({ type:'text', text: buf.join('\n') }); buf = []; }
  };

  while(i < lines.length){
    const m = lines[i].match(/^\s{0,3}```(.*)$/);
    if(m){
      flush();
      const lang = (m[1] || '').trim().split(/\s+/)[0] || '';
      const codeLines = [];
      i++;
      while(i < lines.length){
        if(/^\s{0,3}```\s*$/.test(lines[i])){ i++; break; }
        codeLines.push(lines[i]);
        i++;
      }
      out.push({ type:'code', lang: lang, code: codeLines.join('\n') });
      continue;
    }
    buf.push(lines[i]);
    i++;
  }
  flush();
  return out;
}

/* ---------- 文件卡片 ---------- */
function fileIconFor(lang){
  if(['js','javascript','jsx','ts','typescript','tsx','mjs','vue','svelte'].includes(lang)) return '📜';
  if(['css','scss','less'].includes(lang)) return '🎨';
  if(['json','yaml','yml','xml','toml','ini'].includes(lang)) return '⚙️';
  if(['py','python'].includes(lang)) return '🐍';
  if(['md','markdown','mdx'].includes(lang)) return '📝';
  if(['sql'].includes(lang)) return '🗃️';
  if(['sh','bash','shell','zsh','powershell','ps1'].includes(lang)) return '💻';
  if(['java','kotlin','scala'].includes(lang)) return '☕';
  if(['go','golang'].includes(lang)) return '🐹';
  if(['rust','rs'].includes(lang)) return '🦀';
  return '📄';
}

function guessFilename(lang, code, isHtml){
  // 代码里显式声明的文件名
  const m = code.match(/^\s*(?:\/\/|#|\/\*|<!--)\s*(?:file(?:name)?\s*[:：]\s*)?([\w\-.]+\.(?:html?|css|js|jsx|ts|tsx|py|java|go|rs|cpp|c|cs|php|rb|sh|json|yml|yaml|md|vue|sql|kt|swift|dart|lua))\b/i);
  if(m) return m[1];

  if(isHtml){
    const t = code.match(/<title>([^<]{1,40})<\/title>/i);
    if(t){
      const clean = t[1].trim().replace(/[\\/:*?"<>|]/g, '');
      if(clean) return clean + '.html';
    }
    return 'index.html';
  }
  const l = (lang || '').toLowerCase();
  const ext = EXT_MAP[l] || (l ? l.replace(/[^a-z0-9]/g, '') : 'txt') || 'txt';
  return 'code.' + ext;
}

function renderFileCard(block, key){
  const rawLang = (block.lang || '').trim().toLowerCase();
  const code = block.code || '';
  const isHtml = rawLang === 'html' || rawLang === 'htm'
              || (!rawLang && /^\s*(<!DOCTYPE\s+html|<html[\s>])/i.test(code));
  const langKey = rawLang || (isHtml ? 'html' : '');
  const label = LANG_NAMES[langKey] || (langKey ? langKey.toUpperCase() : '纯文本');
  const filename = guessFilename(langKey, code, isHtml);
  const lineCount = code.split('\n').length;
  const sizeStr = formatBytes(new Blob([code]).size);
  const collapsible = lineCount > 18;
  const isExpanded = expandedCards.has(key) || !collapsible;
  const isPreviewing = isHtml && previewCards.has(key);

  const previewBtn = isHtml
    ? '<button class="fc-btn" data-act="preview" data-key="' + key + '">' +
        (isPreviewing ? '关闭预览' : '预览') + '</button>'
    : '';

  return '' +
  '<div class="file-card" data-key="' + key + '">' +
    '<div class="file-head">' +
      '<div class="file-icon">' + (isHtml ? '🌐' : fileIconFor(langKey)) + '</div>' +
      '<div class="file-info">' +
        '<div class="file-name">' + escapeHtml(filename) + '</div>' +
        '<div class="file-sub">' + escapeHtml(label) + ' · ' + lineCount + ' 行 · ' + sizeStr + '</div>' +
      '</div>' +
      '<div class="file-actions">' +
        previewBtn +
        '<button class="fc-btn" data-act="copy" data-key="' + key + '">复制</button>' +
        '<button class="fc-btn" data-act="download" data-key="' + key + '">下载</button>' +
      '</div>' +
    '</div>' +
    '<div class="file-body' + (isExpanded ? ' expanded' : '') + '">' +
      '<pre><code>' + escapeHtml(code) + '</code></pre>' +
    '</div>' +
    (collapsible
      ? '<button class="file-toggle" data-act="toggle" data-key="' + key + '">' +
          (isExpanded ? '收起 ▲' : '展开全部 ▼') + '</button>'
      : '') +
    (isPreviewing
      ? '<div class="file-preview"><iframe sandbox="allow-scripts allow-forms allow-modals allow-popups" srcdoc="' +
          escapeHtml(code) + '"></iframe></div>'
      : '') +
  '</div>';
}

function renderMarkdown(md, msgKey){
  if(!md) return '';
  const parts = splitFences(md);
  let html = '';
  let codeIdx = 0;
  for(let i = 0; i < parts.length; i++){
    const p = parts[i];
    if(p.type === 'code'){
      html += renderFileCard(p, msgKey + ':c' + (codeIdx++));
    }else{
      html += renderText(p.text);
    }
  }
  return html;
}

/* ============================================================
 *  消息渲染
 * ============================================================ */
function buildMessageEl(msg, idx, convId){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + msg.role;
  wrap.dataset.idx = idx;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = msg.role === 'user' ? '你' : 'AI';

  const content = document.createElement('div');
  content.className = 'content';

  if(msg.role === 'user'){
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.content;
    content.appendChild(bubble);
  }else{
    const md = document.createElement('div');
    md.className = 'md';
    md.innerHTML = renderMarkdown(msg.content, convId + ':' + idx);
    content.appendChild(md);

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML =
      '<button data-act="copy-msg">复制</button>' +
      '<button data-act="regen">重新生成</button>';
    content.appendChild(actions);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(content);
  return wrap;
}

function buildEmptyState(){
  const div = document.createElement('div');
  div.className = 'empty';
  div.innerHTML =
    '<div class="empty-logo">✦</div>' +
    '<h2>有什么可以帮你的？</h2>' +
    '<p>代码会以「文件卡片」形式展示，长内容自动折叠，<br>不再需要滑动很久才能回到顶部</p>' +
    '<div class="chips">' +
      '<button class="chip" data-prompt="用 HTML + CSS + JS 写一个漂亮的时钟页面">写一个 HTML 时钟</button>' +
      '<button class="chip" data-prompt="用 Python 写一个快速排序，并解释思路">Python 快速排序</button>' +
      '<button class="chip" data-prompt="用 HTML 写一个完整的待办事项应用（单文件）">待办事项应用</button>' +
      '<button class="chip" data-prompt="解释一下 JavaScript 中的闭包，举个例子">解释闭包</button>' +
    '</div>';
  return div;
}

function scrollToBottom(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function nearBottom(){
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 130;
}

function renderMessages(){
  const conv = getCurrent();
  messagesEl.innerHTML = '';
  if(!conv || conv.messages.length === 0){
    messagesEl.appendChild(buildEmptyState());
    topbarTitle.textContent = conv ? (conv.title || '新对话') : '新对话';
    return;
  }
  topbarTitle.textContent = conv.title || '新对话';
  conv.messages.forEach((m, i) => {
    messagesEl.appendChild(buildMessageEl(m, i, conv.id));
  });
  scrollToBottom();
}

function appendMessageEl(msg, idx){
  const empty = messagesEl.querySelector('.empty');
  if(empty) empty.remove();
  const conv = getCurrent();
  const node = buildMessageEl(msg, idx, conv.id);
  messagesEl.appendChild(node);
  return node;
}

/* ============================================================
 *  会话列表
 * ============================================================ */
function renderConversationList(){
  convListEl.innerHTML = '';
  state.conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === state.currentId ? ' active' : '');
    item.dataset.id = c.id;

    const title = document.createElement('span');
    title.className = 'conv-title';
    title.textContent = c.title || '新对话';

    const del = document.createElement('button');
    del.className = 'conv-del';
    del.textContent = '×';
    del.title = '删除';

    item.appendChild(title);
    item.appendChild(del);

    item.addEventListener('click', (e) => {
      if(e.target === del){
        e.stopPropagation();
        deleteConversation(c.id);
        return;
      }
      if(c.id !== state.currentId){
        if(generating) stopGeneration();
        state.currentId = c.id;
        saveState();
        renderConversationList();
        renderMessages();
      }
      closeSidebarMobile();
    });

    convListEl.appendChild(item);
  });
}

function createConversation(shouldRender){
  const conv = { id: uid(), title:'新对话', messages: [], createdAt: Date.now() };
  state.conversations.unshift(conv);
  state.currentId = conv.id;
  saveState();
  if(shouldRender !== false){
    renderConversationList();
    renderMessages();
    inputEl.focus();
  }
  return conv;
}

function deleteConversation(id){
  const idx = state.conversations.findIndex(c => c.id === id);
  if(idx === -1) return;
  state.conversations.splice(idx, 1);
  if(state.currentId === id){
    if(!state.conversations.length) createConversation(false);
    else state.currentId = state.conversations[0].id;
  }
  saveState();
  renderConversationList();
  renderMessages();
}

/* ============================================================
 *  发送 / 生成
 * ============================================================ */
function setSendingUI(active){
  sendBtn.style.display = active ? 'none' : 'flex';
  stopBtn.style.display = active ? 'flex' : 'none';
}

function showError(message){
  const div = document.createElement('div');
  div.className = 'error-box';
  div.innerHTML = '<strong>请求出错</strong><div>' + escapeHtml(message) + '</div>';
  messagesEl.appendChild(div);
  scrollToBottom();
}

async function sendMessage(){
  if(generating) return;
  const text = inputEl.value.trim();
  if(!text) return;

  let conv = getCurrent();
  if(!conv){ conv = createConversation(false); }

  // 首条消息 → 用内容做标题
  if(conv.messages.length === 0){
    conv.title = text.replace(/\s+/g, ' ').slice(0, 22) + (text.length > 22 ? '…' : '');
  }

  conv.messages.push({ role:'user', content: text });
  inputEl.value = '';
  autoResize();

  appendMessageEl({ role:'user', content: text }, conv.messages.length - 1);
  scrollToBottom();
  topbarTitle.textContent = conv.title || '新对话';
  saveState();
  renderConversationList();

  await generate();
}

async function generate(){
  const conv = getCurrent();
  if(!conv) return;

  const settings = getSettings();
  if(!settings.apiKey){
    toast('请先在设置中填写 API Key');
    openSettings();
    return;
  }

  const msgIndex = conv.messages.length;
  const assistantMsg = { role:'assistant', content:'' };
  conv.messages.push(assistantMsg);

  const msgEl = appendMessageEl(assistantMsg, msgIndex);
  const mdEl = msgEl.querySelector('.md');
  const msgKey = conv.id + ':' + msgIndex;
  scrollToBottom();

  generating = true;
  setSendingUI(true);
  abortController = new AbortController();

  let acc = '';
  let rafId = null;

  const scheduleRender = () => {
    if(rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      mdEl.innerHTML = renderMarkdown(acc, msgKey) + '<span class="cursor"></span>';
      if(nearBottom()) scrollToBottom();
    });
  };

  const history = conv.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
  const payload = {
    model: settings.model,
    messages: settings.systemPrompt
      ? [{ role:'system', content: settings.systemPrompt }].concat(history)
      : history,
    stream: true
  };
  const t = parseFloat(settings.temperature);
  if(!isNaN(t)) payload.temperature = t;

  try{
    const res = await fetch(joinUrl(settings.baseUrl, '/chat/completions'), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + settings.apiKey
      },
      body: JSON.stringify(payload),
      signal: abortController.signal
    });

    if(!res.ok){
      let detail = '';
      try{
        const j = await res.json();
        detail = (j && j.error && j.error.message) ? j.error.message : JSON.stringify(j);
      }catch(e){
        try{ detail = await res.text(); }catch(e2){ detail = ''; }
      }
      throw new Error('HTTP ' + res.status + ' · ' + String(detail).slice(0, 300));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for(let k = 0; k < lines.length; k++){
        const line = lines[k].trim();
        if(!line || line.charAt(0) === ':') continue;
        if(line.indexOf('data:') !== 0) continue;

        const data = line.slice(5).trim();
        if(data === '[DONE]') continue;

        let json;
        try{ json = JSON.parse(data); }catch(e){ continue; }

        const choice = json.choices && json.choices[0];
        if(!choice) continue;
        const delta = choice.delta ? choice.delta.content : (choice.message ? choice.message.content : '');
        if(typeof delta === 'string' && delta){
          acc += delta;
          scheduleRender();
        }
      }
    }

    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }

    if(!acc.trim()){
      acc = '（模型没有返回内容）';
    }
    assistantMsg.content = acc;
    mdEl.innerHTML = renderMarkdown(acc, msgKey);
    if(nearBottom()) scrollToBottom();

  }catch(err){
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }

    if(err && err.name === 'AbortError'){
      if(acc.trim()){
        assistantMsg.content = acc;
        mdEl.innerHTML = renderMarkdown(acc, msgKey) +
          '<p style="color:#8a8f98;font-size:13px;">（已停止生成）</p>';
      }else{
        conv.messages.pop();
        msgEl.remove();
      }
    }else{
      conv.messages.pop();
      msgEl.remove();
      showError((err && err.message) ? err.message : String(err));
    }
  }finally{
    generating = false;
    abortController = null;
    setSendingUI(false);
    saveState();
    renderConversationList();
    inputEl.focus();
  }
}

function stopGeneration(){
  if(abortController){
    try{ abortController.abort(); }catch(e){}
  }
}

async function regenerateFrom(idx){
  if(generating) return;
  const conv = getCurrent();
  if(!conv) return;
  conv.messages = conv.messages.slice(0, idx);
  saveState();
  renderMessages();
  await generate();
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
function autoResize(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
}

/* ---- 消息区事件委托 ---- */
messagesEl.addEventListener('click', async (e) => {
  // 快捷提示词
  const chip = e.target.closest('.chip');
  if(chip){
    inputEl.value = chip.dataset.prompt || '';
    autoResize();
    sendMessage();
    return;
  }

  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const key = btn.dataset.key || '';

  /* ---- 消息级操作 ---- */
  if(act === 'copy-msg'){
    const msgEl = btn.closest('.msg');
    const idx = parseInt(msgEl.dataset.idx, 10);
    const conv = getCurrent();
    const m = conv && conv.messages[idx];
    if(m){
      const ok = await copyText(m.content);
      toast(ok ? '已复制' : '复制失败');
    }
    return;
  }

  if(act === 'regen'){
    const msgEl = btn.closest('.msg');
    const idx = parseInt(msgEl.dataset.idx, 10);
    regenerateFrom(idx);
    return;
  }

  /* ---- 文件卡片操作 ---- */
  const card = btn.closest('.file-card');
  if(!card) return;
  const codeEl = card.querySelector('pre code');
  const code = codeEl ? codeEl.textContent : '';
  const nameEl = card.querySelector('.file-name');
  const filename = nameEl ? nameEl.textContent : 'code.txt';

  if(act === 'copy'){
    const ok = await copyText(code);
    toast(ok ? '代码已复制' : '复制失败');
    return;
  }

  if(act === 'download'){
    downloadText(code, filename);
    toast('已开始下载 ' + filename);
    return;
  }

  if(act === 'toggle'){
    const body = card.querySelector('.file-body');
    const nowExpanded = body.classList.toggle('expanded');
    if(nowExpanded) expandedCards.add(key);
    else expandedCards.delete(key);
    btn.textContent = nowExpanded ? '收起 ▲' : '展开全部 ▼';
    return;
  }

  if(act === 'preview'){
    const existing = card.querySelector('.file-preview');
    if(existing){
      existing.remove();
      previewCards.delete(key);
      btn.textContent = '预览';
    }else{
      const wrap = document.createElement('div');
      wrap.className = 'file-preview';
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups');
      iframe.srcdoc = code;
      wrap.appendChild(iframe);
      card.appendChild(wrap);
      previewCards.add(key);
      btn.textContent = '关闭预览';
    }
    return;
  }
});

/* ---- 输入框 ---- */
inputEl.addEventListener('input', autoResize);

inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);
stopBtn.addEventListener('click', stopGeneration);

/* ---- 侧边栏 ---- */
el('newChatBtn').addEventListener('click', () => {
  if(generating) stopGeneration();
  createConversation(true);
  closeSidebarMobile();
});

el('menuBtn').addEventListener('click', () => {
  if(window.innerWidth <= 820){
    sidebarEl.classList.toggle('open');
    sidebarMask.classList.toggle('show', sidebarEl.classList.contains('open'));
  }else{
    sidebarEl.classList.toggle('collapsed');
  }
});

function closeSidebarMobile(){
  if(window.innerWidth <= 820){
    sidebarEl.classList.remove('open');
    sidebarMask.classList.remove('show');
  }
}
sidebarMask.addEventListener('click', closeSidebarMobile);

el('clearAllBtn').addEventListener('click', () => {
  if(!confirm('确定要清空所有对话吗？此操作不可恢复。')) return;
  if(generating) stopGeneration();
  state.conversations = [];
  createConversation(false);
  renderConversationList();
  renderMessages();
  toast('已清空');
});

/* ---- 设置 ---- */
function openSettings(){
  const s = getSettings();
  el('setBaseUrl').value = s.baseUrl;
  el('setApiKey').value  = s.apiKey;
  el('setModel').value   = s.model;
  el('setSystem').value  = s.systemPrompt;
  el('setTemp').value    = s.temperature;
  settingsModal.classList.add('show');
  setTimeout(() => el('setBaseUrl').focus(), 50);
}
function closeSettings(){ settingsModal.classList.remove('show'); }

el('settingsBtn').addEventListener('click', () => { openSettings(); closeSidebarMobile(); });
el('modalCloseBtn').addEventListener('click', closeSettings);
el('btnCancel').addEventListener('click', closeSettings);
settingsModal.addEventListener('click', (e) => {
  if(e.target === settingsModal) closeSettings();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && settingsModal.classList.contains('show')) closeSettings();
});

el('btnSaveSettings').addEventListener('click', () => {
  const temp = parseFloat(el('setTemp').value);
  const s = {
    baseUrl: el('setBaseUrl').value.trim() || DEFAULT_SETTINGS.baseUrl,
    apiKey: el('setApiKey').value.trim(),
    model: el('setModel').value.trim() || DEFAULT_SETTINGS.model,
    systemPrompt: el('setSystem').value,
    temperature: isNaN(temp) ? DEFAULT_SETTINGS.temperature : Math.max(0, Math.min(2, temp))
  };
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){}
  closeSettings();
  updateModelBadge();
  toast('设置已保存');
});

function updateModelBadge(){
  const s = getSettings();
  modelBadge.textContent = s.model || '-';
  modelBadge.title = s.baseUrl;
}

/* ---- 窗口尺寸变化 ---- */
window.addEventListener('resize', () => {
  if(window.innerWidth > 820){
    sidebarEl.classList.remove('open');
    sidebarMask.classList.remove('show');
  }
});

/* ============================================================
 *  启动
 * ============================================================ */
function init(){
  loadState();
  renderConversationList();
  renderMessages();
  updateModelBadge();
  autoResize();

  if(!getSettings().apiKey){
    setTimeout(() => toast('请先点击左下角「设置」配置 API Key'), 700);
  }
  inputEl.focus();
}

init();

})();
</script>
</body>
</html>
