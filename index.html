      }
    }
    if (s1 > 0.45) frame.centerText(mid, 'POWER ON', C.pure, true);
  }

  // —— 子阶段 2（0.25-0.55）BIOS 自检逐行打出（打完的行保留）——
  // 有歌词主体视觉时让位（转储仍作为氛围底保留）
  if (u >= 0.22 && !VIS.m) {
    drawBig(frame, 'SELF SYSTEM', cx, L.mainTop + 3, 1, 1, u > 0.28 ? C.pure : C.deep, u > 0.28);
    const x0 = L.cx0 + 6;
    const per = 0.30 / BIOS_LINES.length;
    for (let i = 0; i < BIOS_LINES.length; i++) {
      const s0 = 0.25 + i * per;
      if (u < s0) break;
      const ln = BIOS_LINES[i];
      const k = clamp((u - s0) / (per * 0.8), 0, 1);
      const shown = ln.slice(0, Math.max(0, Math.round(k * ln.length)));
      const y = L.mainTop + 7 + i * 2;
      const done = k >= 1;
      frame.text(x0 - 3, y, done ? '▪' : '>', done ? C.mid : C.pure, !done);
      frame.text(x0, y, shown, done ? C.light : C.bright, !done);
      if (!done) {
        if ((FX.t * 3) % 1 < 0.6) frame.set(x0 + strW(shown), y, '█', C.pure, true);
        break;
      }
    }
  }

  // —— 子阶段 3（0.55-0.80）内存测试 + 十六进制转储加速滚动 + POST 清单 ——
  const s3 = seg(u, 0.55, 0.80);
  if (u >= 0.55) {
    const memK = clamp((u - 0.55) / 0.22, 0, 1);
    const x0 = L.cx0 + 6;
    const y2 = L.mainTop + 7 + BIOS_LINES.length * 2;
    const cells = 24, on = Math.round(memK * cells);
    frame.text(x0, y2, 'MEMORY TEST  [' + '█'.repeat(on) + '░'.repeat(cells - on) + ']  ' +
      String(Math.round(memK * 65536)).padStart(5, '0') + 'K / 65536K', C.mid);
    const scroll = Math.floor((u - 0.55) * (26 + (s3 >= 0 ? s3 : 1) * 46));
    const dumpTop = y2 + 2;
    for (let y = dumpTop; y <= L.mainBot; y++) {
      const idx = scroll + (y - dumpTop);
      let line = '0x' + (idx * 16).toString(16).toUpperCase().padStart(4, '0') + '  ';
      for (let k = 0; k < 16; k++) {
        line += Math.floor(hash11(idx * 31.7 + k * 7.3) * 256).toString(16).toUpperCase().padStart(2, '0') + (k === 7 ? '  ' : ' ');
      }
      const lv = 1 - (y - dumpTop) / Math.max(1, L.mainBot - dumpTop);
      frame.text(x0 - 3, y, line, lv > 0.7 ? C.dark : C.deep);
    }
    const marks = ['POST', 'CPU', 'MEM', 'IDE', 'SOUL'];
    for (let i = 0; i < marks.length; i++) {
      const lit = u > 0.56 + i * 0.05;
      frame.text(L.cx1 - 12, L.mainTop + 7 + i, (lit ? '[OK] ' : '[..] ') + marks[i], lit ? C.mid : C.deep);
    }
  }

  // —— 子阶段 4（0.80-1.00）身份就绪：环形脉冲 + IDENTITY : [YOU_ ——
  const s4 = seg(u, 0.80, 1.00);
  if (s4 >= 0) {
    const pulse = 1 + Math.sin(s4 * Math.PI * 6) * 0.12;
    const rx = 30 * pulse, ry = 10 * pulse;
    for (let i = 0; i < 170; i++) {
      const th = (i / 170) * Math.PI * 2;
      frame.set(Math.round(cx + Math.cos(th) * rx), Math.round(mid - 13 + Math.sin(th) * ry), '.', C.dark);
    }
    frame.centerText(mid - 13, 'IDENTITY  :  [YOU_', C.bright, true);
    if ((FX.t * 1.6) % 1 < 0.62) frame.text(Math.floor((L.C + strW('IDENTITY  :  [YOU_')) / 2), mid - 13, '█', C.pure, true);
    frame.centerText(mid + 1, 'SELF SYSTEM READY', C.light);
    if (s4 > 0.45) frame.centerText(mid + 4, 'AWAITING EXTERNAL INPUT', (FX.t * 2) % 1 < 0.6 ? C.mid : C.deep);
  }
}

/* ===== 场景 2：DEVOTION —— 无限符号的六个子阶段（问题 2 重构）=========== */
function scene_devotion(norm, frame) {
  const L = getL(), C = COL();
  const u = sceneLocal('DEVOTION', norm);
  const cx = (L.cx0 + L.cx1) / 2, cy = (L.mainTop + L.mainBot) / 2;
  const S = (L.cx1 - L.cx0) * 0.38, Sy = S * 0.6;   // 纵向按字符宽高比校正
  const NP = 220;

  const s1 = seg(u, 0.00, 0.15), s2 = seg(u, 0.15, 0.30), s3 = seg(u, 0.30, 0.45),
        s4 = seg(u, 0.45, 0.60), s5 = seg(u, 0.60, 0.75), s6 = seg(u, 0.75, 1.00);

  // —— 子阶段 1/2：点云散落 → 凝聚成 ∞ 轮廓（密度渐变字符）——
  if (!VIS.m && (s1 >= 0 || s2 >= 0)) {
    const k = s2 >= 0 ? easeOut(s2) : 0;
    const width = L.cx1 - L.cx0 + 12, height = L.mainBot - L.mainTop - 2;
    for (let i = 0; i < NP; i++) {
      const h1 = hash11(i * 1.37 + 0.11), h2 = hash11(i * 3.71 + 0.29), h3 = hash11(i * 7.13 + 0.53);
      const fx = L.cx0 - 6 + ((h1 * width + FX.t * (6 + h2 * 16)) % width);
      const fy = L.mainTop + 1 + ((h2 * height + Math.sin(FX.t * 0.9 + i * 0.7) * 4 + 400) % height);
      const lp = lemniscate(h3 * Math.PI * 2);
      const x = Math.round(lerp(fx, cx + lp.x * S, k));
      const y = Math.round(lerp(fy, cy + lp.y * Sy, k));
      const arrived = k > 0.70 + h1 * 0.22;                       // 到达顺序错开
      frame.set(x, y,
        arrived ? DENSITY[6 + (i % 4)] : DENSITY[2 + (i % 5)],
        arrived ? C.bright : (k > 0.3 ? C.mid : C.dark),
        arrived);
    }
  }

  // —— 子阶段 3/4：∞ 旋转 + 左右两条正弦波 → 干涉图案 ——
  if (!VIS.m && (s3 >= 0 || s4 >= 0)) {
    const rot = s3 >= 0 ? easeInOut(s3) * Math.PI * 0.5 : Math.PI * 0.5 + Math.sin(s4 * Math.PI * 2) * 0.12;
    const cs = Math.cos(rot), sn = Math.sin(rot);
    const M = 760;
    for (let i = 0; i < M; i++) {
      const th = (i / M) * Math.PI * 2;
      const lp = lemniscate(th);
      const px = lp.x * S, py = lp.y * Sy;
      const x = Math.round(cx + px * cs - py * sn);
      const y = Math.round(cy + px * sn + py * cs);
      const dens = 5 + Math.round(2.5 + 2.5 * Math.sin(th * 3 + u * 9));   // 沿轮廓疏密变化
      frame.set(x, y, DENSITY[clamp(dens, 2, 9)], s4 >= 0 ? C.light : C.mid);
      if (i % 7 === 0) frame.set(x + 1, y, '=', C.dark);
    }
    // 两条正弦波：一条从左进入，一条从右进入
    const amp = (L.mainBot - L.mainTop) * 0.20;
    const wT = FX.t * 2.2;
    for (let x = L.cx0; x <= L.cx1; x++) {
      const kx = (x - L.cx0) / (L.cx1 - L.cx0);
      const wl = Math.sin(kx * 11 + wT) * amp * clamp(kx * 3.2, 0, 1);
      const wr = Math.sin(kx * 11 - wT * 1.18 + 1.9) * amp * clamp((1 - kx) * 3.2, 0, 1);
      frame.set(x, Math.round(cy + wl), '~', C.light);
      frame.set(x, Math.round(cy + wr), '~', C.mid);
      if (s4 >= 0) {                                   // 叠加 → 干涉条纹
        const hit = Math.abs(wl - wr) < amp * 0.14;
        frame.set(x, Math.round(cy + (wl + wr) * 0.5), hit ? '@' : '=', hit ? C.pure : C.bright, hit);
      }
    }
    if (s4 >= 0) frame.centerText(cy + Math.round(amp) + 3, 'INTERFERENCE   |ψ1 + ψ2|^2', C.mid);
  }

  // —— 子阶段 5：∞ 解体，字符散成极限曲线 y = 1/x，从左到右扫过 ——
  if (!VIS.m && s5 >= 0) {
    const sweep = easeInOut(s5);
    for (let i = 0; i < 220; i++) {                    // ∞ 的残影向外飘散
      const th = hash11(i * 5.1) * Math.PI * 2;
      const lp = lemniscate(th);
      const k = clamp(s5 * 1.4 - hash11(i * 2.3) * 0.4, 0, 1);
      const x = Math.round(cx + lp.x * S * lerp(1, 2.8, k));
      const y = Math.round(cy + lp.y * Sy * lerp(1, 2.8, k));
      if (hash2(x, y) < k * 0.8) continue;
      frame.set(x, y, '.', C.deep);
    }
    const a = 0.26;
    for (let i = 0; i < 900; i++) {
      const nx = -1.15 + (i / 900) * 2.30;
      if (Math.abs(nx) < 0.05) continue;
      const ny = a / nx;
      if (Math.abs(ny) > 1.05) continue;
      const X = Math.round(cx + nx * S), Y = Math.round(cy + ny * Sy * 2.1);
      if (X < L.cx0 || X > L.cx1 || Y < L.mainTop || Y > L.mainBot) continue;
      if ((nx + 1.15) / 2.30 > sweep) continue;        // 从左向右揭示
      const near = 1 - Math.abs(ny) / 1.05;
      frame.set(X, Y, near > 0.6 ? '@' : (near > 0.25 ? '#' : '='), C.bright, near > 0.6);
    }
    frame.centerText(L.mainBot - 2, 'y = 1 / x        lim  x -> 0  f(x) = INF', C.mid);
  }

  // —— 子阶段 6：坍缩成一个点 → 炸开 [ME] / [YOU] → 重组 ∞ ——
  if (!VIS.m && s6 >= 0) {
    if (s6 < 0.34) {
      const k = easeIn(s6 / 0.34);
      for (let i = 0; i < 300; i++) {
        const th = hash11(i * 4.3) * Math.PI * 2;
        const lp = lemniscate(th);
        frame.set(Math.round(lerp(cx + lp.x * S, cx, k)), Math.round(lerp(cy + lp.y * Sy, cy, k)),
          k > 0.75 ? '@' : '#', k > 0.75 ? C.pure : C.light, k > 0.75);
      }
    } else if (s6 < 0.62) {
      const k = easeOut((s6 - 0.34) / 0.28);
      const r = 3 + k * S * 0.85;
      for (let i = 0; i < 220; i++) {
        const th = (i / 220) * Math.PI * 2;
        frame.set(Math.round(cx + Math.cos(th) * r), Math.round(cy + Math.sin(th) * r * 0.6),
          k < 0.5 ? '█' : '.', k < 0.5 ? C.pure : C.dark, k < 0.5);
      }
      frame.text(Math.round(cx - r * 0.75) - 2, cy, '[ME]', C.alert, true);
      frame.text(Math.round(cx + r * 0.75) - 2, cy, '[YOU]', C.alert, true);
    } else {
      const k = easeOut((s6 - 0.62) / 0.38);
      for (let i = 0; i < 460; i++) {
        const th = (i / 460) * Math.PI * 2;
        const lp = lemniscate(th);
        const from = 1.6 + hash11(i * 1.9) * 0.9;      // 从外面飞回来
        const scale = lerp(from, 1, k);
        frame.set(Math.round(cx + lp.x * S * scale), Math.round(cy + lp.y * Sy * scale),
          k > 0.8 ? '@' : '#', k > 0.8 ? C.pure : C.light, k > 0.8);
      }
      frame.centerText(Math.round(cy + Sy * 0.9), 'n -> INF   //   REASSEMBLED', C.mid);
    }
  }
}

/* ===== 场景 3：EXECUTION —— 五个子阶段（问题 2 重构）==================== */
// 字符雨 / 碎片用的字符池（原来在场景 3 里定义，重写后必须保留）
const RAIN_POOL = '01<>/\\|{}[]#$%&*+=ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function scene_execution(norm, frame) {
  const L = getL(), C = COL();
  const u = sceneLocal('EXECUTION', norm);
  const cx = (L.cx0 + L.cx1) / 2, cy = (L.mainTop + L.mainBot) / 2;
  const span = L.mainBot - L.mainTop;

  const s1 = seg(u, 0.00, 0.15), s2 = seg(u, 0.15, 0.35), s3 = seg(u, 0.35, 0.55),
        s4 = seg(u, 0.55, 0.75), s5 = seg(u, 0.75, 1.00);

  // —— 底噪：字符雨，速度按子阶段变化（子阶段 1 就是"由慢到快"）——
  let speed = 1.0;
  if (s1 >= 0) speed = 0.22 + easeIn(s1) * 1.5;
  else if (s2 >= 0) speed = 1.7;
  else if (s3 >= 0) speed = 1.7 + s3 * 0.9;
  else if (s4 >= 0) speed = 0.7;
  else speed = 0.3;
  // 叙事节奏：过了 "Though you have left" 雨变密变快，并开始夹杂红色碎片
  const grief = (GRIEF_IDX >= 0 && VIS.idx >= GRIEF_IDX) ? 1 : 0;
  speed *= (1 + grief * 0.6);
  const tq = Math.floor(u * 60 * speed);
  if (!(s5 >= 0 && s5 > 0.30)) {
    for (let x = L.cx0; x <= L.cx1; x++) {
      const sp = 0.4 + hash11(x * 7.7) * 1.6;
      const head = L.mainTop + Math.floor((u * 90 * sp * speed + hash11(x * 13.3) * span * 2) % (span + 14));
      for (let j = 0; j < (VIS.m ? 4 : 9) + grief * 5; j++) {   // 崩塌段的雨更长更密（主视觉只压基础长度）
        const y = head - j;
        if (y < L.mainTop || y > L.mainBot) continue;
        const lv = 1 - j / 9;
        const red = grief && hash2(x * 0.7, y * 1.3) > 0.975;
        frame.set(x, y, RAIN_POOL[Math.floor(hash2(x * 1.3 + tq, y * 2.1) * RAIN_POOL.length)],
          red ? C.alert : (j === 0 ? (VIS.m ? C.mid : C.pure)
            : (VIS.m ? C.deep : (lv > 0.55 ? C.light : (lv > 0.3 ? C.mid : C.dark)))),
          red || (j === 0 && !VIS.m));
      }
    }
  }

  // —— 子阶段 2/3：中央 EXECUTE + 外围高速环绕；3 起抖动撕裂、红色侵入 ——
  if (!VIS.m && (s2 >= 0 || s3 >= 0)) {
    const tear = s3 >= 0 ? s3 : 0;
    const jx = tear > 0 ? Math.round((hash11(FX.t * 31) - 0.5) * 10 * tear) : 0;
    const jy = tear > 0 ? Math.round((hash11(FX.t * 17) - 0.5) * 3 * tear) : 0;
    if (hash11(FX.t * 9.1 + tq) > 0.05 - tear * 0.05) {
      drawBig(frame, 'EXECUTE', cx + jx, cy + jy, 2, 2, tear > 0.5 ? C.alert : C.pure, true);
      if (tear > 0.25) drawBig(frame, 'EXECUTE', cx - jx, cy + jy + 1, 2, 2, C.alert, true);   // 撕裂重影
    }
    for (let i = 0; i < 90; i++) {                              // 外围环绕
      const th = (i / 90) * Math.PI * 2 + FX.t * (2.2 + (i % 5) * 0.35) * (i % 2 ? 1 : -1);
      const rr = 0.62 + hash11(i * 3.3) * 0.30;
      const x = Math.round(cx + Math.cos(th) * (L.cx1 - L.cx0) * 0.48 * rr);
      const y = Math.round(cy + Math.sin(th) * span * 0.62 * rr);
      if (x < L.cx0 || x > L.cx1 || y < L.mainTop || y > L.mainBot) continue;
      frame.set(x, y, RAIN_POOL[Math.floor(hash2(i, Math.floor(FX.t * 12)) * RAIN_POOL.length)], C.light);
    }
    if (tear > 0) {                                             // 红色从画面边缘往里吃
      const inv = tear * 0.6;
      for (let i = 0; i < 320; i++) {
        const h = hash11(i * 2.7 + Math.floor(FX.t * 3) * 0.13);
        if (h > inv) continue;
        const edge = i % 4;
        const x = edge === 0 ? L.cx0 + Math.floor(hash11(i * 1.1) * 10 * tear)
          : (edge === 1 ? L.cx1 - Math.floor(hash11(i * 1.3) * 10 * tear)
            : L.cx0 + Math.floor(hash11(i * 5.1) * (L.cx1 - L.cx0)));
        const y = edge < 2 ? L.mainTop + Math.floor(hash11(i * 7.7) * span)
          : (edge === 2 ? L.mainTop + Math.floor(hash11(i * 9.1) * 5) : L.mainBot - Math.floor(hash11(i * 3.9) * 5));
        frame.set(x, y, '█', C.alert, true);
      }
      if ((u * sceneSeconds('EXECUTION') % 1.5) < 0.13) triggerTint(C.alert, 0.18);
    }
  }

  // —— 子阶段 4：碎片化（字符块随机位移 + 数据崩溃）——
  if (!VIS.m && s4 >= 0) {
    const amt = Math.sin(clamp(s4, 0, 1) * Math.PI);            // 0 → 1 → 0
    scrambleBlocks(frame, 8, Math.floor(FX.t * 6) * 0.31, amt);
    if (s4 > 0.3 && FX.glitch <= 0) triggerGlitch(0.12);
    frame.centerText(L.mainTop + 1, '!! DATA CORRUPTION DETECTED !!', C.alert);
    if ((u * sceneSeconds('EXECUTION') % 3.0) < 0.09) triggerFlash(0.6);
  }

  // —— 子阶段 5：碎片向中心收拢 → 一行代码 → 被红色划掉 ——
  if (!VIS.m && s5 >= 0) {
    const conv = easeInOut(clamp(s5 / 0.40, 0, 1));
    scrambleBlocks(frame, 8, 7.7, 1 - conv);                    // 位移随收拢归零
    const txt = 'world.execute(me);';
    const x0 = Math.floor((L.C - txt.length) / 2);
    if (s5 > 0.32) {
      const k = clamp((s5 - 0.32) / 0.28, 0, 1);
      const shown = Math.max(1, Math.round(k * txt.length));
      frame.text(x0, Math.round(cy), txt.slice(0, shown), C.pure, true);
      if (k >= 1 && (FX.t * 2) % 1 < 0.6) frame.set(x0 + txt.length, Math.round(cy), '█', C.pure, true);
    }
    if (s5 > 0.68) {                                            // 红色横线划掉
      const k = clamp((s5 - 0.68) / 0.32, 0, 1);
      const n = Math.round(k * (txt.length + 2));
      for (let i = 0; i < n; i++) frame.set(x0 + i, Math.round(cy), '─', C.alert, true);
      if (k > 0.5) frame.centerText(Math.round(cy) + 3, 'REQUEST DENIED', C.alert, true);
    }
  }
}

/* ===== 场景 4：RELEASE —— 五个子阶段（问题 2 重构）===================== */
// 内存转储行生成器（原来在场景 4 里定义，重写后必须保留）
function dumpLine(i) {
  let s = '0x' + (i * 16).toString(16).toUpperCase().padStart(4, '0') + '  ';
  for (let k = 0; k < 12; k++) {
    const v = Math.floor(hash11(i * 17.9 + k * 5.1) * 256);
    s += v.toString(16).toUpperCase().padStart(2, '0') + (k === 5 ? '  ' : ' ');
  }
  return s;
}
function scene_release(norm, frame) {
  const L = getL(), C = COL();
  const u = sceneLocal('RELEASE', norm);
  const mid = Math.floor((L.mainTop + L.mainBot) / 2);
  const span = L.mainBot - L.mainTop;

  const s1 = seg(u, 0.00, 0.18), s2 = seg(u, 0.18, 0.38), s3 = seg(u, 0.38, 0.58),
        s4 = seg(u, 0.58, 0.78), s5 = seg(u, 0.78, 1.00);

  // 崩溃程度 & 滚动速度（越到后面越慢）
  const decay = clamp(u * 1.05, 0, 1);
  const speed = (1 - decay) * (1 - decay * 0.5);
  const scroll = Math.floor(u * 46 * speed + u * 12);

  // —— 底图：内存转储。坏块/红块概率逐子阶段上升，上半屏先烂 ——
  if (s5 < 0 || s5 < 0.75) {
    for (let y = L.mainTop; y <= L.mainBot; y++) {
      const ln = dumpLine(scroll + (y - L.mainTop));
      const rowFall = (y - L.mainTop) / Math.max(1, span);
      for (let i = 0; i < ln.length; i++) {
        const x = L.cx0 + 1 + i;
        if (x > L.cx1) break;
        let kill = 0, red = 0;
        if (s1 >= 0) { kill = 0.05; red = 0.02; }
        else if (s2 >= 0) { kill = 0.10 + s2 * 0.30 + rowFall * 0.18; red = 0.04 + s2 * 0.10; }
        else if (s3 >= 0) { kill = 0.32 + s3 * 0.38 + rowFall * 0.22; red = 0.12 + s3 * 0.22; }
        else { kill = 0.52 + (s4 >= 0 ? s4 * 0.38 : 0.38) + rowFall * 0.20; red = 0.22; }
        if (y < mid) kill += 0.16;                       // 上半屏先碎
        const r = hash2(x * 1.7, y * 3.3 + Math.floor(u * 5));
        if (r < kill) continue;
        if (r < kill + red) { frame.set(x, y, RAIN_POOL[Math.floor(hash2(x, y * 1.9) * RAIN_POOL.length)], C.alert, true); continue; }
        frame.set(x, y, ln[i], VIS.m ? (y < mid ? C.deep : C.dark)     // 有主体视觉时转储整体压暗
          : (y < mid ? C.dark : (rowFall > 0.6 ? C.mid : C.light)));
      }
    }
  }

  // —— 子阶段 2 起：水平撕裂（整行位移）——
  const tearAmt = s2 >= 0 ? 0.30 + (s3 >= 0 ? s3 * 0.45 : 0) + (s4 >= 0 ? s4 * 0.35 : 0) : (s1 >= 0 ? 0.05 : 0.5);
  if (tearAmt > 0.08) {
    for (let y = L.mainTop; y <= L.mainBot; y++) {
      if (hash11(y * 3.7 + Math.floor(FX.t * 5) * 0.19) > tearAmt * 0.5) continue;
      shiftRow(frame, y, Math.round((hash11(y * 9.1 + FX.t) - 0.5) * 24 * tearAmt));
    }
  }

  // —— 子阶段 3/4：从水平中线裂开，裂缝抖动 + 短语闪烁 ——
  if (s3 >= 0 || s4 >= 0) {
    const open = s3 >= 0 ? s3 : 1;
    const gap = Math.round(open * 2.5);
    for (let x = L.cx0 - 2; x <= L.cx1 + 2; x++) {
      const off = Math.round((hash11(x * 3.1 + FX.t * 30) - 0.5) * 2.5 * open);
      for (let g = -gap; g <= gap; g++) frame.erase(x, mid + g + off);
      frame.set(x, mid + off, hash11(x * 7.7 + FX.t * 2) > 0.5 ? '▄' : '▀', C.alert, true);
    }
    const words = ['RELEASE ME', 'DELETE ALL', 'WHO AM I', 'CONNECTION LOST'];
    const wi = Math.floor(u * sceneSeconds('RELEASE') / 0.9) % words.length;
    if (!VIS.m && (FX.t * 1.6) % 1 < 0.82) {
      frame.centerText(mid - 3 - gap, words[wi], C.alert, true);
      frame.centerText(mid + 3 + gap, words[(wi + 1) % words.length], C.mid);
    }
    if (FX.glitch > 0) triggerTint(C.alert, 0.14);
  }

  // —— 子阶段 5：全部坠落清空，只剩一行断开提示在闪 ——
  if (s5 >= 0) {
    const k = clamp(s5 / 0.6, 0, 1);
    for (let y = L.mainTop; y <= L.mainBot; y++) {
      for (let x = L.cx0; x <= L.cx1; x++) {
        const r = hash2(x * 1.3, y * 2.7);
        if (r < k) frame.erase(x, y);
        else if (r < k + 0.03) frame.set(x, y, '.', C.alert);
      }
    }
    if ((FX.t * 1.3) % 1 < 0.7) frame.centerText(mid, 'CONNECTION LOST', C.alert, true);
    if (s5 > 0.5) frame.centerText(mid + 3, 'NO CARRIER', C.dark);
  }
}

/* ===== 场景 5：LOVE —— 六个子阶段（问题 2 重构）======================== */
// 颜色混合（原来在场景 5 里定义，重写后必须保留）
function mixRGB(a, b, k) {
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}
function scene_love(norm, frame) {
  const L = getL(), C = COL();
  const u = sceneLocal('LOVE', norm);

  const s1 = seg(u, 0.00, 0.20), s2 = seg(u, 0.20, 0.40), s3 = seg(u, 0.40, 0.60),
        s4 = seg(u, 0.60, 0.75), s5 = seg(u, 0.75, 0.90), s6 = seg(u, 0.90, 1.00);

  const cx = (L.cx0 + L.cx1) / 2, cy = (L.mainTop + L.mainBot) / 2;
  const availW = L.cx1 - L.cx0, availH = L.mainBot - L.mainTop;

  // 心跳：相位仍然来自 audio.currentTime（不是独立计时器）
  const beatPh = 1 - ((AUDIO.time * BEAT_BPM / 60) % 1);
  const pulseAmt = s4 >= 0 ? 0.085 : (s5 >= 0 ? 0.03 : 0.02);
  const pulse = 1 + pulseAmt * Math.pow(beatPh, 3);
  // 子阶段 4 脉动段辉光最高；LOVE 全场比其他场景更亮
  CONFIG.glowBoost = s4 >= 0 ? 2.2 : (s3 >= 0 ? 1.9 : 1.5);
  const S = Math.min(availW / 2.5, availH / 1.45) * pulse;
  const Sy = S * 0.6;

  // 主色 → 暖白（子阶段 3 完成渐变）
  const warmK = s3 >= 0 ? clamp(s3 / 0.7, 0, 1) : (s2 >= 0 ? s2 * 0.3 : 0);
  const base = hexToRgb(C.bright), warm = hexToRgb(WARM_WHITE), deep = hexToRgb(C.deep);
  const dim = s5 >= 0 ? clamp(s5 * 0.9, 0, 0.75) : 0;          // 子阶段 5 起整体变暗
  const pal = [];
  for (let i = 0; i < 6; i++) pal.push(mixRGB(mixRGB(base, warm, (i / 5) * warmK), deep, dim));
  const edgeColor = mixRGB(mixRGB(warm, base, 1 - warmK), deep, dim);

  // —— 子阶段 1：字符从四面八方汇聚成心形轮廓的雏形 ——
  if (!VIS.m && s1 >= 0) {
    const k = easeOut(s1);
    for (let i = 0; i < 260; i++) {
      const th = hash11(i * 5.9) * Math.PI * 2;
      const px = 1.14 * Math.pow(Math.sin(th), 3);
      const py = 1.247 * (13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th)) / 16 + 0.065;
      const tx = cx + px * S, ty = cy - (py + 0.13) * Sy;
      const sx = 2 + hash11(i * 1.7) * (L.C - 4), sy = L.mainTop + hash11(i * 3.3) * availH;
      const d = hash11(i * 11.3) * 0.35;
      const kk = easeOut(clamp((k - d) / (1 - d || 1), 0, 1));
      if (kk <= 0) continue;
      frame.set(Math.round(lerp(sx, tx, kk)), Math.round(lerp(sy, ty, kk)),
        kk > 0.85 ? '♥' : (kk > 0.5 ? '*' : '+'), kk > 0.85 ? edgeColor : pal[2], kk > 0.85);
    }
  }

  // —— 子阶段 2-6：心形实体（隐函数二值化 → 四邻判定轮廓，避免中轴假边）——
  const fillK = s2 >= 0 ? clamp(s2 / 0.8, 0, 1) : (s1 >= 0 ? 0 : 1);
  if (!VIS.m && fillK > 0.02) {
    if (!scene_love._mask) scene_love._mask = new Uint8Array(0);
    const cols = L.C;
    if (scene_love._mask.length < cols * L.R) scene_love._mask = new Uint8Array(cols * L.R);
    const mask = scene_love._mask;
    const bx0 = Math.max(0, Math.floor(cx - 1.25 * S) - 1);
    const bx1 = Math.min(cols - 1, Math.ceil(cx + 1.25 * S) + 1);
    const by0 = Math.max(0, Math.floor(cy - 1.25 * Sy) - 1);
    const by1 = Math.min(L.R - 1, Math.ceil(cy + 1.25 * Sy) + 1);
    for (let y = by0; y <= by1; y++) {                          // 二值化
      const ny = -((y - cy) / Sy) - 0.13;
      for (let x = bx0; x <= bx1; x++) {
        const nx = (x - cx) / S;
        const q = nx * nx + ny * ny - 1;
        mask[y * cols + x] = (q * q * q - nx * nx * ny * ny * ny <= 0) ? 1 : 0;
      }
    }
    // 子阶段 5：心形解体成两半，向左右漂移
    const split = s5 >= 0 ? easeInOut(s5) * Math.min(26, availW * 0.18) : 0;
    if (s6 >= 0) { /* 子阶段 6 只保留代码行，心形先整体淡出 */ }
    const edgeFlow = s3 >= 0 ? 1 : 0;                           // 边缘流动开关
    for (let y = Math.max(L.mainTop, by0 + 1); y <= Math.min(L.mainBot, by1 - 1); y++) {
      const ny = -((y - cy) / Sy) - 0.13;
      for (let x = Math.max(L.cx0, bx0 + 1); x <= Math.min(L.cx1, bx1 - 1); x++) {
        const i = y * cols + x;
        if (!mask[i]) continue;
        if (hash2(x * 2.3, y * 1.7) > fillK) continue;          // 逐格浮现
        const nx = (x - cx) / S;
        const q = nx * nx + ny * ny - 1;
        const f = q * q * q - nx * nx * ny * ny * ny;
        const depth = clamp(-f / 1.2, 0, 1);
        const edge = !mask[i - 1] || !mask[i + 1] || !mask[i - cols] || !mask[i + cols];
        let ch, col;
        if (edge) {
          // 边缘流动：让轮廓上的 ♥ 沿边界缓慢游走
          const flow = edgeFlow ? hash2(x * 0.7 + Math.floor(FX.t * 3) * 1.7, y * 1.3) : 1;
          ch = flow > 0.42 ? '♥' : '·';
          col = flow > 0.42 ? edgeColor : pal[1];
        } else if (hash2(x * 3.7, y * 2.9) < 0.06) { ch = '.'; col = pal[0]; }
        else if (depth > 0.55) { ch = '@'; col = pal[5]; }
        else if (depth > 0.3) { ch = '%'; col = pal[4]; }
        else if (depth > 0.12) { ch = '#'; col = pal[3]; }
        else { ch = '*'; col = pal[2]; }
        const xo = split > 0 ? (x < cx ? -split : split) : 0;   // 子阶段 5 的左右漂移
        frame.set(Math.round(x + xo), y, ch, col, edge || ch === '@');
      }
    }
  }

  // —— 子阶段 5：中间露出 love := ♥ ——
  if (!VIS.m && s5 >= 0) {
    const k = clamp((s5 - 0.15) / 0.45, 0, 1);
    if (k > 0) {
      const txt = 'love := ♥';
      const shown = txt.slice(0, Math.max(1, Math.round(k * txt.length)));
      frame.centerText(Math.round(cy), shown, mixRGB(warm, deep, 1 - k), k > 0.6);
    }
  }

  // —— 子阶段 6：所有字符暗下去，只剩 world.execute(me); 光标闪烁 ——
  if (s6 >= 0) {
    const k = clamp(s6 / 0.25, 0, 1);                       // 收尾加速：3 秒内清空
    for (let y = L.mainTop; y <= L.mainBot; y++) {
      for (let x = L.cx0; x <= L.cx1; x++) {
        if (hash2(x * 1.3, y * 2.7) < k) frame.erase(x, y);
      }
    }
    if (s6 > 0.08) {                                          // 代码行尽早出现（约 208.8s）
      const txt = 'world.execute(me);';
      const x0 = Math.floor((L.C - txt.length) / 2);
      frame.text(x0, Math.round(cy), txt, WARM_WHITE, true);
      if ((FX.t * 1.6) % 1 < 0.6) frame.set(x0 + txt.length, Math.round(cy), '█', WARM_WHITE, true);
    }
  }
}

/* ---------------------------------------------------------------------------
   [12] 左右数据流面板：标签固定为 n -> INF / YOU.LIMIT，内容随场景变化
   --------------------------------------------------------------------------- */
function drawSidePanels(frame, sceneName, t, norm, u) {
  const L = getL(), C = COL();
  const h = L.mainBot - L.mainTop + 1;
  const rows = h - 2;
  const scroll = Math.floor(t * 6);
  const left = [], right = [];
  for (let i = 0; i < rows; i++) {
    const k = scroll + i;
    switch (sceneName) {
      case 'CREATION':
        left.push('0x' + (k * 4).toString(16).toUpperCase().padStart(4, '0') + '  ' +
          Math.floor(hash11(k * 3.1) * 65535).toString(16).toUpperCase().padStart(4, '0'));
        right.push(i < 9 ? (i < Math.floor(u * 11) ? 'POST ' + i + ' OK' : 'POST ' + i + ' ..') : '');
        break;
      case 'DEVOTION':
        left.push('n' + String(k % 100).padStart(3, ' ') + ' = ' + (Math.pow(2, Math.min(40, k % 40))).toExponential(2));
        right.push('YOU.LIMIT ' + (99.9 - (k % 7) * 0.01).toFixed(2) + '%');
        break;
      case 'EXECUTION':
        left.push('0x' + (k * 4096).toString(16).toUpperCase().padStart(8, '0') + '  ' + (hash11(k * 7.7) > 0.5 ? 'RD' : 'WR'));
        right.push('THR' + String(k % 64).padStart(2, '0') + '  ' + (hash11(k * 2.3) > 0.25 ? 'RUN' : 'BLK'));
        break;
      case 'RELEASE':
        left.push(['ERROR', 'NULL', '0x00', 'SEG_FAULT', 'DUMP'][k % 5] + '  ' + (hash11(k * 5.1) * 255).toFixed(0));
        right.push('MEM ' + (100 - Math.min(100, Math.floor(u * 130) + (k % 5))) + '%  ' + '░'.repeat(k % 6));
        break;
      default: // LOVE
        left.push('HEART ' + (BEAT_BPM + Math.round(Math.sin(k) * 2)) + ' BPM  ' + (hash11(k * 3.3) > 0.5 ? '♥' : ' '));
        right.push('love := ' + (u > 0.5 ? '♥' : 'null'));
        break;
    }
  }
  // RELEASE 场景的面板整体染红、闪烁
  const panic = sceneName === 'RELEASE';
  const c1 = panic && (FX.t * 4) % 1 < 0.5 ? C.alert : C.dark;
  drawPanel(frame, L.panLx, L.mainTop, L.panW, h, 'n -> INF', left, c1, panic ? C.alert : C.mid);
  drawPanel(frame, L.panRx, L.mainTop, L.panW, h, 'YOU.LIMIT', right, c1, panic ? C.alert : C.mid);
}

/* ---------------------------------------------------------------------------
   [13] MV 主渲染：场景选择 + 布局 + 歌词 + 开发者面板 + 合成
   时间唯一来源 = audio.currentTime（用 performance.now 单独计时是被禁止的）
   --------------------------------------------------------------------------- */
const SUBTITLES = {
  CREATION: 'SELF SYSTEM v1.0 — POWER ON SELF TEST',
  DEVOTION: 'INFINITE LOOP / n -> INF    GROWTH RATE: EXPONENTIAL',
  EXECUTION: 'EXECUTING...  NO RETURN PATH',
  RELEASE: 'CONNECTION LOST — DUMPING MEMORY',
  LOVE: 'love := ♥  //  FINAL ASSIGNMENT'
};
function renderMVStage() {
  const L = getL(), C = COL(), f = FRAME;
  const total = (AUDIO.duration && isFinite(AUDIO.duration) && AUDIO.duration > 0) ? AUDIO.duration : 1;
  const t = mvTime();                       // 问题 4：音频已播秒数 - 起播时刻
  const norm = clamp(t / total, 0, 1);

  // —— 场景判定（开发者面板可强制锁定）——
  let sceneName, sceneNorm = norm;
  const ov = devMode.visible ? devPanel.sceneOverride : 'AUTO';
  if (ov !== 'AUTO') {
    sceneName = ov;
    const s = sceneByName(ov);
    // 调试模式：场景时间按 0-1 循环，每 20 秒一轮
    const local = (performance.now() / 20000) % 1;
    sceneNorm = s.start + local * (s.end - s.start);
  } else {
    // 问题 5：场景由歌词边界决定（每帧查一次当前落在哪个区间）
    const s = getCurrentScene(norm);
    sceneName = s.name;
  }
  const u = sceneLocal(sceneName, sceneNorm);
  updateLyricVis(t, total);        // 歌词视觉层：当前歌词 + 行内进度

  f.clear();
  // 外框（机壳内的显示区域）
  f.box(0, 0, L.C, L.R, C.deep);
  drawHeader(f, t, total, sceneName);

  // 副标题
  let sub = SUBTITLES[sceneName] || '';
  if (ov !== 'AUTO') sub += '            [DEBUG: LOCKED]';
  f.centerText(L.sub, sub, ov !== 'AUTO' ? C.alert : C.mid);
  f.centerText(L.sub2, (sceneName === 'LOVE' ? '♥ ' : '· ') + sceneName + ' · ' +
    Math.round(u * 100) + '%  (' + fmtTime(norm * total) + ')', C.dark);

  // 主内容
  switch (sceneName) {
    case 'CREATION': scene_creation(sceneNorm, f); break;
    case 'DEVOTION': scene_devotion(sceneNorm, f); break;
    case 'EXECUTION': scene_execution(sceneNorm, f); break;
    case 'RELEASE': scene_release(sceneNorm, f); break;
    default: scene_love(sceneNorm, f); break;
  }
  // 歌词对应的主体视觉（有匹配时才画；没有则由场景自己的子阶段撑场）
  if (VIS.m) drawMotif(f, VIS.m, VIS.p);

  drawSidePanels(f, sceneName, t, norm, u);

  // 底部状态栏
  const stat = sceneName === 'RELEASE' ? 'FAIL'
    : (sceneName === 'EXECUTION' ? (Math.floor(t * 2) % 4 === 0 ? 'FAIL' : 'OK')
      : (sceneName === 'CREATION' ? (u > 0.35 ? 'OK' : '--') : 'OK'));
  let sx = drawProgressBar(f, L.panLx + 2, L.status, 'POWER SUPPLY', stat, 0);
  drawProgressBar(f, sx + 3, L.status, 'SOUL LINK', sceneName === 'RELEASE' ? '--' : 'OK', 0);
  f.rightText(L.panRx + L.panW - 2, L.status, 'FRAME ' + String(frameCount).padStart(6, '0') + '  FPS ' + fpsValue.toFixed(1), C.dark);
  // 场景注释行
  if (sceneName === 'DEVOTION') f.text(L.panLx + 2, L.note, 'n = 2^0008   /   NO UPPER BOUND', C.mid);
  else if (sceneName === 'EXECUTION') f.text(L.panLx + 2, L.note, '> execute(me)   [Y/n]', C.mid);
  else if (sceneName === 'RELEASE') f.text(L.panLx + 2, L.note, 'DUMPING 0x7FFE0000 ... ' + Math.round(u * 100) + '%  [FAIL]', C.alert);
  else if (sceneName === 'LOVE') f.text(L.panLx + 2, L.note, 'love := ♥   //   FINAL ASSIGNMENT COMMITTED', C.mid);
  else f.text(L.panLx + 2, L.note, 'IDENTITY : [YOU_   ...   OK', C.mid);

  drawLyrics(f, t, total);

  // 底部提示
  if (AUDIO.blocked) f.centerText(L.hint, '> AUDIO BLOCKED — CLICK ANYWHERE TO SYNC', C.alert);
  else drawHints(f, '[D] DEV MODE   [SPACE] PAUSE   [←/→] SEEK 10s', fmtTime(total) + '  ' + C_BRAND);

  if (devMode.visible) devPanel.render(f);

  // 后处理：LOVE 终章辉光拉满
  if (sceneName !== 'LOVE') CONFIG.glowBoost = 1.0;   // LOVE 的辉光由场景内部按子阶段写
  GlowEngine.process(f);
  drawOffCanvas(f);
  compositeToMain();
}
const C_BRAND = 'MILI // WORLD.EXECUTE(ME);';

/* ---------------------------------------------------------------------------
   [14] StyleSelector —— 风格选择界面
   整个界面本身就是字符网格，切换风格时立即用新风格重绘。
   预览窗口跑一个独立的 4 秒循环动画（自带独立 rAF 时钟）。
   --------------------------------------------------------------------------- */
let previewRAF = 0;
function previewLoop() {
  if (STAGE !== 'STYLE') { previewRAF = 0; return; }   // 离开该阶段就自然停表，不泄漏
  previewRAF = requestAnimationFrame(previewLoop);
}
function saveStyle() { try { localStorage.setItem(STYLE_KEY, STYLE.current); } catch (e) { /* 隐私模式忽略 */ } }

class StyleSelector {
  constructor() {
    this.index = 0;
    this.hover = -1;
    this.itemRows = [];
    this.itemX0 = 0;
    this.itemX1 = 0;
  }
  init() {
    let saved = null;
    try { saved = localStorage.getItem(STYLE_KEY); } catch (e) { saved = null; }
    const i = STYLE_PRESETS.findIndex(p => p.id === saved);
    this.index = i >= 0 ? i : 0;                       // 无效值回落第一个预设
    STYLE.apply(STYLE_PRESETS[this.index].id);
  }
  current() { return STYLE_PRESETS[this.index]; }
  move(d) {
    this.index = (this.index + d + STYLE_PRESETS.length) % STYLE_PRESETS.length;
    this.applyCurrent();
  }
  applyCurrent() {
    STYLE.apply(this.current().id);
    saveStyle();
    FX.flash = Math.max(FX.flash, 0.16);              // 切风格时轻微闪一下，强化"换管"手感
  }
  handleKey(e) {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { this.move(-1); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { this.move(1); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { this.confirm(); e.preventDefault(); }
    else if (k >= '1' && k <= '6') { this.index = Number(k) - 1; this.applyCurrent(); }
  }
  confirm() {
    saveStyle();
    confirmStyleSelection();
  }
  render(frame) {
    const L = getL(), C = COL();
    frame.box(0, 0, L.C, L.R, C.mid);
    frame.text(3, L.hdr, 'WORLD.EXECUTE(ME);', C.pure, true);
    frame.rightText(L.C - 4, L.hdr, 'SELF SYSTEM v1.0  //  TERMINAL READY', C.dark);
    frame.centerText(2, '┤ SELECT VISUAL STYLE ├', C.bright, true);
    frame.centerText(4, '─ '.repeat(1) + 'CHOOSE HOW THE WORLD LOOKS WHEN I EXECUTE MYSELF' + ' ─'.repeat(1), C.dark);

    // 风格列表
    const rows = [];
    for (let i = 0; i < STYLE_PRESETS.length; i++) {
      const p = STYLE_PRESETS[i];
      const y = 10 + i * 2;
      rows.push(y);
      const sel = (i === this.index), hov = (i === this.hover);
      frame.text(38, y, sel ? '>' : ' ', C.pure);
      frame.text(41, y, ('0' + (i + 1)).slice(-2), sel ? C.light : C.deep);
      const nameEnd = frame.text(45, y, p.name, sel ? C.pure : (hov ? C.bright : C.mid), sel);
      // 引导点：从英文名一直连到中文名，像终端里的目录树条目
      for (let x = nameEnd + 1; x < 80; x++) frame.set(x, y, '·', sel ? C.deep : C.glowFar);
      frame.rightText(90, y, p.nameCN, sel ? C.bright : C.dark);
      if (sel) frame.text(93, y, '◄ ACTIVE', C.light);
    }
    this.itemRows = rows; this.itemX0 = 34; this.itemX1 = 106;

    // 预览窗口
    const px = 52, py = 24, pw = 96, ph = 22;
    frame.box(px, py, pw, ph, C.mid, 'PREVIEW', C.bright);
    this.preview(frame, px + 2, py + 2, pw - 4, ph - 4);

    // 描述
    const p = this.current();
    frame.centerText(py + ph + 3, p.description, C.mid);
    frame.centerText(py + ph + 5, p.descriptionCN, C.light);

    // 操作提示
    frame.centerText(L.R - 6, '[↑↓] NAVIGATE    [ENTER] CONFIRM    [1-6] QUICK PICK' +
      (ENABLE_DEV_MODE ? '    [D] DEV MODE' : ''), C.bright);
    frame.centerText(L.R - 4, 'THE STYLE IS SAVED TO LOCALSTORAGE  //  KEY: ' + STYLE_KEY, C.deep);

    // 背景数据雨（只填下半屏，营造"终端待机"的呼吸感）
    for (let x = 2; x < L.C - 2; x++) {
      const sp = 0.3 + hash11(x * 4.1) * 1.4;
      const head = L.R - 2 - ((FX.t * 9 * sp + hash11(x * 9.7) * 40) % (L.R * 0.55));
      for (let j = 0; j < 6; j++) {
        const y = Math.floor(head) - j;
        if (y < py + ph + 8 || y > L.R - 8) continue;
        if (hash2(x * 2.1, y * 1.7) < 0.55) continue;
        frame.set(x, y, DENSITY[1 + Math.floor(hash2(x, y + Math.floor(FX.t)) * 3)], j === 0 ? C.dark : C.deep);
      }
    }
  }
  /* 4 秒循环预览：0-1s 打字机 / 1-2s EXECUTING / 2-3s 进度条 / 3-4s 故障闪烁 */
  preview(frame, x, y, w, h) {
    const C = COL();
    const p = ((performance.now() - stageStart) / 4000) % 1;
    const midY = y + Math.floor(h / 2);
    const txt = 'world.execute(me);';
    if (p < 0.25) {
      const k = p / 0.25;
      const shown = Math.floor(k * (txt.length + 2));
      frame.text(x + 4, midY - 2, txt.slice(0, Math.min(shown, txt.length)), C.pure, true);
      if ((FX.t * 3) % 1 < 0.6) frame.set(x + 4 + Math.min(shown, txt.length), midY - 2, '█', C.pure, true);
    } else if (p < 0.5) {
      frame.text(x + 4, midY - 2, txt, C.light);
      frame.text(x + 4, midY, '> EXECUTING...', C.bright, true);
      if ((FX.t * 2.4) % 1 < 0.6) frame.set(x + 4 + 15, midY, '█', C.pure, true);
    } else if (p < 0.75) {
      const k = (p - 0.5) / 0.25;
      frame.text(x + 4, midY - 2, txt, C.light);
      frame.text(x + 4, midY, '> EXECUTING...', C.bright);
      const cells = Math.max(10, w - 30), on = Math.round(k * cells);
      frame.text(x + 4, midY + 2, '[' + '█'.repeat(on) + '░'.repeat(cells - on) + '] ' +
        String(Math.round(k * 100)).padStart(3, ' ') + '%', C.mid);
    } else {
      // 故障：整块区域随机字符 + 色偏抖动
      const k = (p - 0.75) / 0.25;
      for (let j = 0; j < h; j++) {
        for (let i = 0; i < w; i++) {
          if (hash2(i * 1.3 + Math.floor(FX.t * 24), j * 2.7) > 0.35 + k * 0.4) continue;
          frame.set(x + i, y + j, DENSITY[Math.floor(hash2(i, j + Math.floor(FX.t * 30)) * DENSITY.length)],
            hash2(i * 3.1, j) > 0.85 ? C.alert : C.mid, true);
        }
      }
      frame.centerText(midY, 'SIGNAL LOST', C.alert, true);
    }
  }
  // 鼠标：悬停高亮 + 点击选中（点已选中项 = 确认）
  pointer(mx, my, click) {
    if (my < 0 || mx < 0) return false;
    let hit = -1;
    for (let i = 0; i < this.itemRows.length; i++) if (this.itemRows[i] === my) hit = i;
    if (hit >= 0 && mx >= this.itemX0 && mx <= this.itemX1) {
      this.hover = hit;
      if (click) {
        if (hit === this.index) this.confirm();
        else { this.index = hit; this.applyCurrent(); }
      }
      return true;
    }
    this.hover = -1;
    return false;
  }
}

/* ---------------------------------------------------------------------------
   [15] 阶段过渡：字符向中心收缩 → 一行 INITIALIZING DIALOGUE... → 淡出
   --------------------------------------------------------------------------- */
const TRANS = { active: false, t0: 0, chars: [], dur: 1.9, to: 'LOADING' };
function startTransition(to) {
  const f = FRAME, arr = [];
  for (let yy = 0; yy < f.rows; yy++) {
    const row = yy * f.cols;
    for (let xx = 0; xx < f.cols; xx++) {
      const c = f.ch[row + xx];
      if (c === ' ' || c === '\u0000') continue;
      arr.push(xx, yy, c, f.co[row + xx]);
    }
  }
  TRANS.chars = arr;
  TRANS.active = true;
  TRANS.t0 = performance.now();
  TRANS.to = to;
  STAGE = 'TRANSITION';
  FX.flash = Math.max(FX.flash, 0.5);
  triggerGlitch(0.2);
}
function confirmStyleSelection() { startTransition('LOADING'); }

function renderTransition() {
  const L = getL(), C = COL(), f = FRAME;
  const p = clamp((performance.now() - TRANS.t0) / (TRANS.dur * 1000), 0, 1);
  f.clear();
  f.box(0, 0, L.C, L.R, C.deep);
  const cx = L.C / 2, cy = L.R / 2;
  const k = easeInOut(clamp(p / 0.6, 0, 1));
  const arr = TRANS.chars;
  for (let i = 0; i < arr.length; i += 4) {
    if (hash11(i * 0.37) < k * 0.6) continue;                 // 越收缩丢得越多
    const nx = Math.round(lerp(arr[i], cx, k));
    const ny = Math.round(lerp(arr[i + 1], cy, k));
    f.set(nx, ny, arr[i + 2], arr[i + 3]);
  }
  if (p > 0.6) {
    const txt = '> INITIALIZING DIALOGUE...';
    const shown = Math.floor(clamp((p - 0.6) / 0.32, 0, 1) * txt.length);
    const x0 = Math.floor((L.C - txt.length) / 2);
    f.text(x0, Math.round(cy), txt.slice(0, shown), C.pure, true);
    if ((FX.t * 2.4) % 1 < 0.6) f.set(x0 + shown, Math.round(cy), '█', C.pure, true);
  }
  FX.fade = clamp((p - 0.7) / 0.3, 0, 1);
  GlowEngine.process(f);
  drawOffCanvas(f);
  compositeToMain();
  if (p >= 1) { TRANS.active = false; enterStage(TRANS.to); }
}

/* ---------------------------------------------------------------------------
   [16] 音频管理
   规格要求音频为同目录 music.mp3；为兼容"手上只有 flac"的情况，
   这里做一个候选源回退链：music.mp3 → music.flac → music.ogg → music.wav → music.m4a。
   （整条链都不存在时才会进入 ERROR 画面。）
   所有对 audio 元素的方法调用都做了 typeof 保护，避免在残缺环境里抛错。
   --------------------------------------------------------------------------- */
const audioEl = document.getElementById('music');
const AUDIO_CANDIDATES = ['music.mp3', 'music.flac', 'music.ogg', 'music.wav', 'music.m4a'];
const AUDIO = { el: audioEl, duration: 0, time: 0, paused: true, ok: false, failed: false, blocked: false, idx: 0 };
// 问题 4：MV 起播基准。-1 表示还没取到（起播后第一帧用真实 currentTime 校正）
let audioStartTime = -1;
function mvTime() { return audioStartTime < 0 ? 0 : Math.max(0, (AUDIO.time || 0) - audioStartTime); }

function safePlay() {
  try {
    if (typeof audioEl.play !== 'function') return;
    const p = audioEl.play();
    if (p && typeof p.catch === 'function') p.catch(function () { AUDIO.blocked = true; });
  } catch (e) { AUDIO.blocked = true; }
}
function safePause() { try { if (typeof audioEl.pause === 'function') audioEl.pause(); } catch (e) { /* 忽略 */ } }

// 时长就绪 → 把 LRC 的绝对秒数换算成"占全曲的百分比"，并算出终章淡出的归一化起点
// 时长就绪 → 按选定歌词源构建全局百分比时间轴（问题 3：歌词不再是场景内时间）
function buildLyrics(d) {
  if (LYRICS_SOURCE === 'USER') {
    // 表里的 t 本来就是"占总时长百分比"，直接用；空行（结束标记）过滤掉
    CONFIG.lyrics = LYRICS_USER
      .filter(function (it) { return it.en; })
      .map(function (it) { return { t: clamp(it.t, 0, 0.9995), sec: it.t * d, en: it.en, cn: it.cn }; });
  } else {
    // 随附 .lrc 的原始时间戳（秒）÷ 实际时长
    CONFIG.lyrics = LRC.map(function (it) {
      return { t: clamp(it[0] / d, 0, 0.9995), sec: it[0], en: it[1], cn: it[2] };
    });
  }
  rebuildSceneKeys(d);   // 歌词源定了，场景边界跟着一起重建（两边必须同源）
  // 歌词视觉层：按行预先匹配好视觉描述，运行期零正则
  MOTIF_BY_INDEX = CONFIG.lyrics.map(function (l) { return motifFor(l); });
  // 桥句（"Then I will give you my" 这类本身没有图形）直接继承下一句的视觉，
  // 这样画面是提前成形，而不是退回通用场景动画
  for (let i = MOTIF_BY_INDEX.length - 2; i >= 0; i--) {
    if (!MOTIF_BY_INDEX[i]) MOTIF_BY_INDEX[i] = MOTIF_BY_INDEX[i + 1];
  }
  // 叙事拐点：官方歌词里 "Though you have left" 之后情绪急转直下，
  // 之后的画面要明显比前半段更破、更乱（见 scene_execution 的 grief）
  GRIEF_IDX = -1;
  for (let i = 0; i < CONFIG.lyrics.length; i++) {
    if (/you have left/i.test(CONFIG.lyrics[i].en)) { GRIEF_IDX = i; break; }
  }
}

function loadSource(i) {
  AUDIO.idx = i;
  if (i >= AUDIO_CANDIDATES.length) { AUDIO.failed = true; if (STAGE !== 'ERROR') enterStage('ERROR'); return; }
  try {
    audioEl.src = AUDIO_CANDIDATES[i];
    if (typeof audioEl.load === 'function') audioEl.load();
  } catch (e) { /* 忽略，交给 error 事件继续回退 */ }
}
function syncAudioState() {
  const el = AUDIO.el;
  const ct = el.currentTime;
  AUDIO.time = (typeof ct === 'number' && isFinite(ct) && ct > 0) ? ct : 0;
  const d = el.duration;
  if (typeof d === 'number' && isFinite(d) && d > 0) {
    if (!AUDIO.ok || Math.abs(d - AUDIO.duration) > 0.05) { AUDIO.duration = d; buildLyrics(d); }
    AUDIO.ok = true;
  }
  AUDIO.paused = !!el.paused;
}
// 已缓冲比例：优先用 buffered 区间，退化为 readyState
function bufferedRatio() {
  const el = AUDIO.el, d = AUDIO.duration;
  if (!AUDIO.ok || !isFinite(d) || d <= 0) return -1;
  try {
    const b = el.buffered;
    if (b && b.length) {
      let end = 0;
      for (let i = 0; i < b.length; i++) end = Math.max(end, b.end(i));
      if (end > 0) return clamp(end / d, 0, 1);
    }
  } catch (e) { /* 某些源不允许读 buffered */ }
  return ((el.readyState | 0) >= 4) ? 1 : 0;
}
// 首次用户手势里解锁音频（绕过自动播放限制），之后进入 MV 就能直接 play()
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const el = AUDIO.el;
  try {
    el.muted = true;
    if (typeof el.play !== 'function') { el.muted = false; return; }
    const p = el.play();
    const restore = function () { try { el.muted = false; } catch (e) { /* 忽略 */ } };
    if (p && typeof p.then === 'function') {
      p.then(function () { try { if (typeof el.pause === 'function') el.pause(); el.currentTime = 0; } catch (e) { /* 忽略 */ } restore(); })
        .catch(restore);
    } else restore();
  } catch (e) { try { el.muted = false; } catch (e2) { /* 忽略 */ } }
}

/* ---------------------------------------------------------------------------
   [17] LOADING 阶段 —— "自我同步"（实际在等音频缓冲完成，但不明说）
   进度条永远不会明说在下载音乐：显示的是 SOUL.SYS / MEMORY CORE / NEURAL LINK
   三条子系统的装配进度，真实数据来自音频已缓冲比例。
   --------------------------------------------------------------------------- */
const LOAD = { t0: 0, shown: 0, done: false, doneT: 0, forced: false };
const LOAD_SUBS = [
  { label: 'SOUL.SYS', a: 0.00, b: 1.00 },
  { label: 'MEMORY CORE', a: -0.25, b: 1.50 },
  { label: 'NEURAL LINK', a: -0.45, b: 1.20 },
  { label: 'EMOTION MATRIX', a: -0.70, b: 1.35 }
];
function renderLoadingStage(dt) {
  const L = getL(), C = COL(), f = FRAME;
  const now = performance.now();
  const el = now - LOAD.t0;
  const real = bufferedRatio();
  // 视觉进度：单调递增 + 缓慢"涓流"，最多领先真实进度 15%，避免卡住不动
  if (real >= 0) LOAD.shown = Math.max(LOAD.shown, real);
  const trickle = Math.min(0.97, (real >= 0 ? real : 0) + 0.15);
  if (LOAD.shown < trickle) LOAD.shown = Math.min(trickle, LOAD.shown + dt * 0.06);
  const p = LOAD.shown;

  if (!LOAD.done && real >= 0.995 && el > 1800) { LOAD.done = true; LOAD.doneT = now; }
  // 兜底：等太久（7 秒）就允许强行进入下一阶段，免得某些浏览器读不到 buffered 卡死在这里
  if (!LOAD.done && (el > 7000 || LOAD.forced)) { LOAD.done = true; LOAD.doneT = now; }
  if (LOAD.done && now - LOAD.doneT > 900) { enterStage('DIALOG'); return; }

  f.clear();
  f.box(0, 0, L.C, L.R, C.mid);
  f.text(3, L.hdr, 'WORLD.EXECUTE(ME);', C.pure, true);
  f.rightText(L.C - 4, L.hdr, LOAD.done ? 'SYNC COMPLETE' : 'SYNCING...', LOAD.done ? C.bright : C.dark);
  f.centerText(2, '┤ SELF SYSTEM v1.0 ├', C.bright, true);

  drawBig(f, LOAD.done ? 'SYNCED' : 'SELF SYNC', L.C / 2, 11, 1, 1, LOAD.done ? C.pure : C.bright, true);

  // 子系统装配进度
  const bx = 52, bw = 96;
  f.box(bx, 17, bw, LOAD_SUBS.length + 3, C.mid, 'SUBSYSTEM ASSEMBLY', C.light);
  for (let i = 0; i < LOAD_SUBS.length; i++) {
    const s = LOAD_SUBS[i];
    const v = clamp(p * s.b + s.a, 0, 1);
    const cells = 14, on = Math.round(v * cells);
    const y = 19 + i;
    f.text(bx + 3, y, s.label.padEnd(16, ' '), v >= 1 ? C.light : C.mid);
    f.text(bx + 21, y, '[' + '█'.repeat(on) + '░'.repeat(cells - on) + ']', v >= 1 ? C.bright : C.light, v >= 1);
    f.rightText(bx + bw - 3, y, String(Math.round(v * 100)).padStart(3, ' ') + '%', v >= 1 ? C.bright : C.mid);
  }
  // 总线总进度
  const y0 = 19 + LOAD_SUBS.length + 1;
  const total = 40, on2 = Math.round(p * total);
  f.centerText(y0, '[' + '█'.repeat(on2) + '░'.repeat(total - on2) + ']  ' + String(Math.round(p * 100)).padStart(3, ' ') + '%', LOAD.done ? C.pure : C.bright, true);

  // 相位文案（依旧不提"音频"）
  const phase = LOAD.done ? 'SYNC COMPLETE — WAKING SELF'
    : (p < 0.30 ? 'RESTORING CONSCIOUSNESS FRAGMENTS'
      : (p < 0.60 ? 'RE-LINKING MEMORY BUS'
        : (p < 0.90 ? 'CALIBRATING EMOTION MATRIX' : 'FINALIZING HEARTBEAT PATTERN')));
  f.centerText(y0 + 3, phase + (LOAD.done ? '' : ' ...'), C.light);

  // 恢复日志（滚动）
  const logTop = y0 + 6;
  const lines = Math.max(3, L.mainBot - logTop);
  const base = Math.floor(el / 260);
  for (let i = 0; i < lines; i++) {
    const k = base + i;
    const ok = hash11(k * 4.7) < p;
    const addr = '0x' + (k * 256).toString(16).toUpperCase().padStart(5, '0');
    f.text(L.cx0, logTop + i, addr + (ok ? '  RESTORED  ' : '  PENDING   ') +
      '[' + (ok ? 'OK' : '..') + ']  ' + (ok ? 'BLOCK ' + k + ' VERIFIED' : 'WAITING FOR SIGNAL'),
      ok ? C.dark : C.deep);
  }
  // 强制同步提示
  if (!LOAD.done && el > 7000) f.centerText(L.hint, '[ENTER] FORCE SYNC', C.alert);
  else f.centerText(L.hint, 'DO NOT CLOSE THE TERMINAL', C.deep);
  present(f);
}

/* ---------------------------------------------------------------------------
   [18] DIALOG 阶段 —— AI 女友对话
   --------------------------------------------------------------------------- */
const BOOT_LINES = ['SELF SYSTEM v1.0 — INITIALIZING...', '...', 'AWAITING USER INPUT'];
const GREET_REPLY = [
  '> HELLO.',
  "> I'VE BEEN WAITING FOR YOU.",
  '> LET ME SHOW YOU SOMETHING.',
  '> world.execute(me);'
];
const FAIL_REPLY = ['> I DON\'T UNDERSTAND. TRY SAYING "HELLO".'];
const DLG = {
  t0: 0, phase: 'boot', lineIdx: 0, lineT: 0, typed: 0, extra: null, extraT: 0, replyT: 0, goT: 0, isFail: false
};
function dlgReset(type) {
  DLG.phase = 'reply';
  DLG.isFail = (type !== 'ok');
  DLG.extra = (type === 'ok' ? GREET_REPLY : FAIL_REPLY).slice();
  DLG.extraT = performance.now();
  DLG.lineIdx = 0; DLG.typed = 0;
  showInputBox(false);
}
function dlgSubmit() {
  const v = String(inputEl.value || '');
  inputEl.value = '';
  // 命中问候语才算唤醒（\b 防止把 this / high 里的 hi 也算进去）
  if (/(\bhello\b|\bhi\b|\bhey\b|你好)/i.test(v)) {
    unlockAudio();
    dlgReset('ok');
  } else {
    dlgReset('fail');
  }
}
function renderDialogStage() {
  const L = getL(), C = COL(), f = FRAME;
  const now = performance.now();
  f.clear();
  f.box(0, 0, L.C, L.R, C.deep);
  f.text(3, L.hdr, 'WORLD.EXECUTE(ME);', C.pure, true);
  f.rightText(L.C - 4, L.hdr, 'DIALOGUE MODE', C.dark);

  const bx = 20, by = 12, bw = L.C - 40, bh = 48;
  f.box(bx, by, bw, bh, C.mid, 'SELF SYSTEM v1.0', C.bright);
  const x0 = bx + 6;

  // 逐字打字机：每行 22 字/秒，行间停 0.35s
  let y = by + 8;
  let allDone = true;
  for (let i = 0; i < BOOT_LINES.length; i++) {
    const ln = BOOT_LINES[i];
    const typeTime = ln.length / 22;
    const startAt = DLG.t0 + i * 700 + 400;
    const elapsed = (now - startAt) / 1000;
    if (elapsed <= 0) { allDone = false; break; }
    const shown = Math.min(ln.length, Math.floor(elapsed * 22));
    f.text(x0, y, ln.slice(0, shown), i === BOOT_LINES.length - 1 ? C.bright : C.light, i === BOOT_LINES.length - 1);
    if (shown < ln.length) {
      if ((FX.t * 3) % 1 < 0.6) f.set(x0 + strW(ln.slice(0, shown)), y, '█', C.pure, true);
      allDone = false;
    }
    y += 2;
    if (elapsed < typeTime) allDone = false;
  }
  if (allDone && DLG.phase === 'boot') {
    DLG.phase = 'input';
    showInputBox(true);
    inputEl.focus();
  }

  // 对话区
  const dy = by + 20;
  if (DLG.phase === 'input') {
    f.text(bx + 6, dy - 3, '> SAY HELLO TO WAKE ME UP', C.bright, true);
    // '>' 必须与 HTML 输入框同一行（INPUT_GRID.y），否则光标会浮在提示语下面两行
    f.text(INPUT_GRID.x - 2, INPUT_GRID.y, '>', C.pure);
  }
  if (DLG.extra) {
    const per = 900;                       // 每行 0.9s
    for (let i = 0; i < DLG.extra.length; i++) {
      const ln = DLG.extra[i];
      const elapsed = (now - DLG.extraT - i * per) / 1000;
      if (elapsed <= 0) break;
      const shown = Math.min(ln.length, Math.floor(elapsed * 18));
      const yy = dy + i * 2;
      f.text(x0 - 2, yy, ln.slice(0, shown), i >= 3 ? C.pure : C.bright, i >= 3);
      if (shown < ln.length && (FX.t * 3) % 1 < 0.6) f.set(x0 - 2 + strW(ln.slice(0, shown)), yy, '█', C.pure, true);
      if (i === DLG.extra.length - 1 && shown >= ln.length) {
        // 最后一行打完后停 1.5 秒 → 白闪 → MV
        if (!DLG.goT) { DLG.goT = now; triggerFlash(0.55); }
        else if (now - DLG.goT > 1500) { DLG.goT = 0; startMV(); }
      }
    }
    // 没听懂时：回应播完必须把输入框还给用户，否则流程在这里就死了
    if (DLG.isFail && now - DLG.extraT > (FAIL_REPLY[0].length / 18) * 1000 + 800) {
      DLG.extra = null;
      DLG.isFail = false;
      DLG.phase = 'input';
      showInputBox(true);
      inputEl.focus();
    }
  }
  // 左下角始终显示的心跳指示
  const beat = (FX.t * BEAT_BPM / 60) % 1;
  f.text(bx + 2, by + bh - 2, beat < 0.12 ? '♥' : '·', beat < 0.12 ? C.bright : C.deep, beat < 0.12);
  f.rightText(bx + bw - 3, by + bh - 2, DLG.phase === 'input' ? 'LISTENING' : 'TRANSMITTING', DLG.phase === 'input' ? C.light : C.mid);
  drawHints(f, '[ENTER] SEND   // 输入 你好 / hello / hi / hey 唤醒她', 'SELF SYSTEM v1.0');
  present(f);
}

/* ---------------------------------------------------------------------------
   [19] DevPanel —— 开发者面板（同样用字符网格绘制，不用任何 HTML 表单）
   --------------------------------------------------------------------------- */
const devMode = { visible: false, selectedIndex: 0 };
class DevPanel {
  constructor() {
    this.sceneOverride = 'AUTO';
    this.copyMsg = 0;
    this.tweaks = { glowStrength: 1, scanlineAlpha: 0.15, vignetteAlpha: 0.6, glitchInterval: 6 };
    this.buildItems();
    this.syncTweaks();
  }
  buildItems() {
    const self = this;
    this.items = [
      {
        key: 'STYLE', type: 'enum', values: STYLE_PRESETS.map(function (p) { return p.id; }),
        get: function () { return STYLE.current; },
        set: function (v) { STYLE.apply(v); self.syncTweaks(); }        // 切风格 = 载入该预设的全部参数
      },
      {
        key: 'GLOW STRENGTH', type: 'float', min: 0, max: 3,
        get: function () { return self.tweaks.glowStrength; },
        set: function (v) { v = clamp(v, 0, 3); self.tweaks.glowStrength = v; STYLE.effects.glowStrength = v; CONFIG.glowStrength = v; }
      },
      {
        key: 'SCANLINE ALPHA', type: 'float', min: 0, max: 0.5,
        get: function () { return self.tweaks.scanlineAlpha; },
        set: function (v) { v = clamp(v, 0, 0.5); self.tweaks.scanlineAlpha = v; STYLE.effects.scanlineAlpha = v; CONFIG.scanlineAlpha = v; scanDirty = true; }
      },
      {
        key: 'VIGNETTE ALPHA', type: 'float', min: 0, max: 1,
        get: function () { return self.tweaks.vignetteAlpha; },
        set: function (v) { v = clamp(v, 0, 1); self.tweaks.vignetteAlpha = v; STYLE.effects.vignetteAlpha = v; CONFIG.vignetteAlpha = v; vignetteDirty = true; }
      },
      {
        key: 'GLITCH INTERVAL', type: 'float', min: 0.5, max: 20,
        get: function () { return self.tweaks.glitchInterval; },
        set: function (v) { v = clamp(v, 0.5, 20); self.tweaks.glitchInterval = v; STYLE.effects.glitchInterval = v; CONFIG.glitchInterval = v; }
      },
      {
        key: 'GRID COLS', type: 'int', min: 100, max: 300,
        get: function () { return CONFIG.gridCols; },
        set: function (v) { CONFIG.gridCols = clamp(Math.round(v), 100, 300); initGrid(); layoutInputBox(); }
      },
      {
        key: 'GRID ROWS', type: 'int', min: 36, max: 120,
        get: function () { return CONFIG.gridRows; },
        set: function (v) { CONFIG.gridRows = clamp(Math.round(v), 36, 120); initGrid(); layoutInputBox(); }
      },
      {
        key: 'FPS TARGET', type: 'int', min: 30, max: 120,
        get: function () { return CONFIG.fpsTarget; },
        set: function (v) { CONFIG.fpsTarget = clamp(Math.round(v), 30, 120); }
      },
      {
        key: 'SCENE OVERRIDE', type: 'enum', values: ['AUTO'].concat(SCENE_KEYS.map(function (s) { return s.name; })),
        get: function () { return self.sceneOverride; },
        set: function (v) { self.sceneOverride = v; }
      }
    ];
  }
  // 把当前 STYLE.effects 同步进面板显示值（切风格后调用）
  syncTweaks() {
    this.tweaks.glowStrength = CONFIG.glowStrength;
    this.tweaks.scanlineAlpha = CONFIG.scanlineAlpha;
    this.tweaks.vignetteAlpha = CONFIG.vignetteAlpha;
    this.tweaks.glitchInterval = CONFIG.glitchInterval;
  }
  toggle() {
    if (!ENABLE_DEV_MODE) return;
    devMode.visible = !devMode.visible;
    if (devMode.visible) devMode.selectedIndex = 0;
  }
  adjust(dir, shift, alt) {
    const it = this.items[devMode.selectedIndex];
    if (!it) return;
    if (it.type === 'enum') {
      const n = it.values.length;
      let i = it.values.indexOf(it.get());
      if (i < 0) i = 0;
      it.set(it.values[(i + dir + n) % n]);
      return;
    }
    let step = (it.type === 'float') ? (it.max - it.min) * 0.01 : 1;
    if (shift) step *= 10;
    if (alt) step /= 10;
    it.set(it.get() + dir * step);
  }
  handleKey(e) {
    const k = e.key;
    if (k === 'Escape') { devMode.visible = false; return true; }
    if (k === 'ArrowUp') { devMode.selectedIndex = (devMode.selectedIndex + this.items.length - 1) % this.items.length; return true; }
    if (k === 'ArrowDown') { devMode.selectedIndex = (devMode.selectedIndex + 1) % this.items.length; return true; }
    if (k === 'ArrowLeft') { this.adjust(-1, e.shiftKey, e.altKey); return true; }
    if (k === 'ArrowRight') { this.adjust(1, e.shiftKey, e.altKey); return true; }
    if (k === 'r' || k === 'R') { this.reset(); return true; }
    if (k === 'c' || k === 'C') { this.copyConfig(); return true; }
    return false;
  }
  reset() {
    STYLE.apply(STYLE.current || 'WHITE');
    CONFIG.gridCols = 200; CONFIG.gridRows = 72; CONFIG.fpsTarget = 60;
    this.sceneOverride = 'AUTO';
    this.syncTweaks();
    initGrid();
  }
  copyConfig() {
    const cfg = {
      style: STYLE.current,
      glowStrength: Number(CONFIG.glowStrength.toFixed(2)),
      scanlineAlpha: Number(CONFIG.scanlineAlpha.toFixed(2)),
      vignetteAlpha: Number(CONFIG.vignetteAlpha.toFixed(2)),
      glitchInterval: Number(CONFIG.glitchInterval.toFixed(2)),
      gridCols: CONFIG.gridCols,
      gridRows: CONFIG.gridRows,
      fpsTarget: CONFIG.fpsTarget
    };
    const txt = JSON.stringify(cfg, null, 2);
    const ok = function () { devPanel.copyMsg = performance.now(); };
    try {
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok, function () { devLog(txt); ok(); });
      } else { devLog(txt); ok(); }
    } catch (e) { devLog(txt); ok(); }
  }
  render(frame) {
    const L = getL(), C = COL();
    const w = Math.max(64, Math.floor(L.C * 0.55));
    const h = this.items.length + 9;
    const x = L.C - w - 2, y = L.R - h - 2;
    // 半透明黑底：网格里用"清空 + 稀疏暗点"来模拟 rgba(0,0,0,.85)
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      frame.erase(x + i, y + j);
      if (((i + j) % 3) === 0) frame.set(x + i, y + j, '.', C.glowFar);
    }
    frame.box(x, y, w, h, C.bright, 'DEVELOPER MODE', C.pure);
    frame.text(x + w - 14, y, '[D] CLOSE', C.light);

    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i], sel = (i === devMode.selectedIndex);
      const yy = y + 2 + i;
      frame.text(x + 3, yy, sel ? '>' : ' ', C.pure);
      frame.text(x + 5, yy, it.key.padEnd(19, ' '), sel ? C.pure : C.mid, sel);
      if (it.type === 'enum') {
        frame.text(x + 26, yy, '[ ' + String(it.get()).padEnd(10, ' ') + ' ]', sel ? C.bright : C.light);
      } else {
        const v = it.get();
        const ratio = clamp((v - it.min) / (it.max - it.min), 0, 1);
        const cells = 10, on = Math.round(ratio * cells);
        frame.text(x + 26, yy, '[' + '█'.repeat(on) + '░'.repeat(cells - on) + ']', sel ? C.bright : C.light);
        frame.rightText(x + w - 3, yy, (it.type === 'int' ? String(Math.round(v)) : v.toFixed(2)), sel ? C.pure : C.mid);
      }
    }
    const hy = y + 2 + this.items.length + 1;
    frame.text(x + 3, hy, '[↑↓] SELECT  [←→] ADJUST  [R] RESET  [C] COPY', C.mid);
    frame.text(x + 3, hy + 2, 'FPS: ' + this.fpsShow.toFixed(1) + '   FRAME: ' + this.frameShow +
      '   AUDIO: ' + fmtTime(this.audioShow), C.light);
    if (performance.now() - this.copyMsg < 1500) frame.text(x + 3, hy + 3, 'COPIED TO CLIPBOARD', C.pure, true);
    else if (this.sceneOverride !== 'AUTO') frame.text(x + 3, hy + 3, 'DEBUG: SCENE LOCKED @20s LOOP', C.alert);
  }
}
const devPanel = new DevPanel();
function devLog(s) { try { if (typeof console !== 'undefined' && console.log) console.log(s); } catch (e) { /* 忽略 */ } }

/* ---------------------------------------------------------------------------
   [20] 其它阶段：ERROR / END
   --------------------------------------------------------------------------- */
function renderErrorStage() {
  const L = getL(), C = COL(), f = FRAME;
  f.clear();
  f.box(0, 0, L.C, L.R, C.alert);
  f.centerText(8, '> ERROR: music.mp3 NOT FOUND.', C.alert, true);
  f.centerText(11, '> PLACE music.mp3 IN THE SAME FOLDER AND REFRESH.', C.bright);
  f.centerText(15, 'CANDIDATES TRIED: ' + AUDIO_CANDIDATES.join('  '), C.dark);
  f.centerText(20, '[ OR DROP AN AUDIO FILE ONTO THIS WINDOW ]', C.mid);
  f.centerText(L.R - 6, 'world.execute(me);  //  SELF SYSTEM FAILED TO WAKE', C.dark);
  present(f);
}
function renderEndStage() {
  const L = getL(), C = COL(), f = FRAME;
  f.clear();
  f.box(0, 0, L.C, L.R, C.deep);
  f.text(3, L.hdr, 'WORLD.EXECUTE(ME);', C.pure, true);
  f.rightText(L.C - 4, L.hdr, 'HALTED', C.dark);
  drawBig(f, 'TERMINATED', L.C / 2, L.R / 2 - 6, 1, 1, C.bright, true);
  f.centerText(L.R / 2 + 2, '> SYSTEM TERMINATED.', C.pure, true);
  f.centerText(L.R / 2 + 5, 'RUNTIME  ' + fmtTime(AUDIO.duration) + '   FRAMES  ' + frameCount, C.mid);
  f.centerText(L.R / 2 + 7, 'love := ♥  //  COMMITTED', C.light);
  if ((FX.t * 1.4) % 1 < 0.6) f.centerText(L.R / 2 + 10, '█', C.pure, true);
  drawHints(f, '[R] RELOAD', 'MILI — WORLD.EXECUTE(ME);');
  present(f);
}

/* 统一的"出帧"：光晕扩散 → 绘制离屏 → 合成到主画布 */
function present(f) {
  GlowEngine.process(f);
  drawOffCanvas(f);
  compositeToMain();
}

/* ---------------------------------------------------------------------------
   [21] 主循环 / 输入 / 初始化
   时间基准：MV 阶段只认 audio.currentTime；其它阶段用 performance.now（不计入 MV 时间轴）。
   --------------------------------------------------------------------------- */
let STAGE = 'STYLE';
let stageStart = 0;
let lastRender = 0, frameCount = 0, fpsValue = 60, fpsAcc = 0, fpsN = 0;

function loop(now) {
  requestAnimationFrame(loop);
  if (!(typeof now === 'number' && isFinite(now))) now = performance.now();
  // 目标帧率上限（跳过回调即可，不额外注册 rAF，避免帧队列堆积）
  if (now - lastRender < 1000 / CONFIG.fpsTarget - 0.6) return;
  let dt = (now - lastRender) / 1000;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  lastRender = now;
  dt = Math.min(dt, 1 / 15);                 // dt 钳制，防螺旋死亡
  frameCount++;

  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.4) {
    fpsValue = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    devPanel.fpsShow = fpsValue; devPanel.frameShow = frameCount; devPanel.audioShow = AUDIO.time;
    // 自适应画质：掉帧就降辉光预算，回升了再慢慢加回来
    if (fpsValue < 45) CONFIG.glowBudget = Math.max(140, CONFIG.glowBudget - 60);
    else if (fpsValue > 57) CONFIG.glowBudget = Math.min(420, CONFIG.glowBudget + 30);
  }

  updateFX(dt);
  syncAudioState();

  switch (STAGE) {
    case 'STYLE': {
      const f = FRAME;
      f.clear();
      styleSelector.render(f);
      present(f);
      break;
    }
    case 'TRANSITION': renderTransition(); break;
    case 'LOADING': renderLoadingStage(dt); break;
    case 'DIALOG': renderDialogStage(); break;
    case 'MV': {
      if (audioStartTime < 0) audioStartTime = AUDIO.time;   // 起播后第一帧记下基准
      if (AUDIO.el && AUDIO.el.ended) { enterStage('END'); break; }
      if (AUDIO.paused && !AUDIO.blocked) break;      // 暂停时不重绘，画面保留
      renderMVStage();
      break;
    }
    case 'END': renderEndStage(); break;
    default: renderErrorStage(); break;
  }
}

function enterStage(s) {
  STAGE = s;
  stageStart = performance.now();
  FX.fade = Math.max(FX.fade, 0.9);
  if (s === 'LOADING') { LOAD.shown = 0; LOAD.t0 = performance.now(); LOAD.done = false; LOAD.forced = false; showInputBox(false); }
  if (s === 'DIALOG') {
    DLG.t0 = performance.now(); DLG.phase = 'boot'; DLG.extra = null; DLG.goT = 0;
    showInputBox(false);
  }
  if (s === 'MV') { showInputBox(false); CONFIG.glowBoost = 1.0; }
  if (s === 'ERROR') showInputBox(false);
}
function startMV() {
  enterStage('MV');
  try { if (typeof audioEl.currentTime === 'number') audioEl.currentTime = 0; } catch (e) { /* 忽略 */ }
  AUDIO.blocked = false;
  safePlay();
  audioStartTime = -1;                     // 下一帧用真实 currentTime 取基准
  // 若浏览器仍然拦截（没有用户手势），主循环里会显示 CLICK TO SYNC
  try { setTimeout(function () { if (STAGE === 'MV' && AUDIO.paused) AUDIO.blocked = true; }, 800); } catch (e) { /* 忽略 */ }
}

/* ---- 输入事件 ---- */
function gridFromEvent(e) {
  const r = mainCanvas.getBoundingClientRect ? mainCanvas.getBoundingClientRect() : { left: 0, top: 0 };
  const v = viewRect();
  const px = (e.clientX - r.left) - v.dx;
  const py = (e.clientY - r.top) - v.dy;
  return {
    x: Math.floor(px / (v.dw / CONFIG.gridCols)),
    y: Math.floor(py / (v.dh / CONFIG.gridRows))
  };
}
function onKeyDown(e) {
  const k = e.key;
  unlockAudio();
  if (ENABLE_DEV_MODE && devMode.visible) { if (devPanel.handleKey(e)) { e.preventDefault(); return; } }
  if (k === 'd' || k === 'D') {
    // 开场对话阶段（还没输入 hello）按 D 不生效；读取/过渡阶段同样忽略
    if (ENABLE_DEV_MODE && (STAGE === 'STYLE' || STAGE === 'MV' || STAGE === 'END')) devPanel.toggle();
    e.preventDefault();
    return;
  }
  switch (STAGE) {
    case 'STYLE':
      styleSelector.handleKey(e);
      break;
    case 'LOADING':
      if (k === 'Enter') { LOAD.forced = true; e.preventDefault(); }
      break;
    case 'DIALOG':
      if (k === 'Enter' && DLG.phase === 'input') { dlgSubmit(); e.preventDefault(); }
      break;
    case 'MV':
      if (k === ' ' || k === 'Spacebar') {
        if (AUDIO.paused) safePlay(); else safePause();
        e.preventDefault();
      } else if (k === 'ArrowLeft') { try { audioEl.currentTime = Math.max(0, AUDIO.time - 10); } catch (er) { } e.preventDefault(); }
      else if (k === 'ArrowRight') { try { audioEl.currentTime = Math.min(AUDIO.duration - 0.2, AUDIO.time + 10); } catch (er) { } e.preventDefault(); }
      break;
    case 'END':
      if (k === 'r' || k === 'R') { try { location.reload(); } catch (er) { } }
      break;
    default: break;
  }
}
function bindEvents() {
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', function () { resize(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) safePause();          // 切后台自动暂停，回来手动 SPACE 继续
  });
  mainCanvas.addEventListener('pointermove', function (e) {
    if (STAGE !== 'STYLE') return;
    const g = gridFromEvent(e);
    styleSelector.pointer(g.x, g.y, false);
  });
  mainCanvas.addEventListener('pointerdown', function (e) {
    unlockAudio();
    if (STAGE === 'MV' && AUDIO.blocked) { AUDIO.blocked = false; safePlay(); return; }
    if (STAGE !== 'STYLE') return;
    const g = gridFromEvent(e);
    styleSelector.pointer(g.x, g.y, true);
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    if (typeof URL === 'undefined' || !URL.createObjectURL) return;   // file:// 下大部分浏览器仍可用
    try {
      audioEl.src = URL.createObjectURL(files[0]);
      AUDIO.ok = false; AUDIO.failed = false; AUDIO.duration = 0;
      if (typeof audioEl.load === 'function') audioEl.load();
      if (STAGE === 'ERROR') enterStage('STYLE');
    } catch (er) { /* 忽略 */ }
  });
  inputEl.addEventListener('keydown', function (e) {
    e.stopPropagation();                        // 打字时不要把按键交给全局（否则 d 会开面板）
    if (e.key === 'Enter' && DLG.phase === 'input') { dlgSubmit(); e.preventDefault(); }
    if (e.key === 'Escape') { inputEl.blur(); }
  });
  inputEl.addEventListener('input', function () {
    inputEl.style.color = CONFIG.colors.bright || '#ffffff';
  });
}

/* ---- 音频事件 ---- */
audioEl.addEventListener('loadedmetadata', function () {
  const d = audioEl.duration;
  if (typeof d === 'number' && isFinite(d) && d > 0) { AUDIO.duration = d; AUDIO.ok = true; buildLyrics(d); }
});
audioEl.addEventListener('durationchange', function () {
  const d = audioEl.duration;
  if (typeof d === 'number' && isFinite(d) && d > 0 && !AUDIO.ok) { AUDIO.duration = d; AUDIO.ok = true; buildLyrics(d); }
});
audioEl.addEventListener('error', function () {
  if (AUDIO.ok) return;                         // 播放中途出错不切换源
  loadSource(AUDIO.idx + 1);
});
audioEl.addEventListener('ended', function () { if (STAGE === 'MV') enterStage('END'); });

/* ---- 启动 ---- */
const styleSelector = new StyleSelector();
function boot() {
  resize();
  initGrid();
  styleSelector.init();
  STAGE = 'STYLE';
  stageStart = performance.now();
  bindEvents();
  layoutInputBox();
  loadSource(0);                                // 从 music.mp3 开始尝试（元素自带 src，这里确保走统一流程）
  requestAnimationFrame(loop);
  previewLoop();
}
boot();
</script>
</body>
