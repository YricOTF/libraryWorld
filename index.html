<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>world.execute(me); // ASCII CRT MV</title>
<link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/lyrics.js"></script>
  <script defer src="assets/engine.js"></script>
  <script defer src="assets/ascii-scenes.js"></script>
  <script defer src="assets/execute.js"></script>
  <script defer src="assets/player.js"></script>
  <script defer src="assets/search.js"></script>
  <script defer src="assets/main.js"></script>
</head>
<body>
  <div id="stage">
    <!-- 可见画布：窗口分辨率，负责最终合成（辉光 / 扫描线 / 暗角 / 故障） -->
    <canvas id="mainCanvas"></canvas>
    <!-- 对话阶段的真实输入框（唯一允许存在的 HTML 表单元素，按网格坐标对齐） -->
    <input id="userInput" type="text" maxlength="64" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <!-- 音频来源面板里的网址输入框 + 隐藏的文件选择器 -->
    <input id="urlInput" type="text" maxlength="512" autocomplete="off" spellcheck="false">
    <input id="fileInput" type="file" accept="audio/*" hidden>
    <!-- 搜索阶段的输入（透明文字，真正显示由画布网格负责，这样手机也能调起键盘） -->
    <input id="seekInput" type="text" maxlength="40" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false">
    <!-- 风格页：输入歌名直接从某一首开始 -->
    <input id="songInput" type="text" maxlength="32" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false">
    <!-- 触屏按钮条（样式跟随当前风格，颜色用 currentColor 注入） -->
    <button id="padToggle">›</button>
    <div id="pad">
      <button data-act="up">▲</button>
      <button data-act="ok">OK</button>
      <button data-act="down">▼</button>
      <button data-act="yes">Y</button>
      <button data-act="no">N</button>
      <button data-act="audio">AUDIO</button>
      <button data-act="dev">DEV</button>
    </div>
    <!-- 竖屏时盖住整屏，提示转屏 -->
    <div id="rotate">
      <div>◤ ROTATE YOUR DEVICE ◢</div>
      <div>横屏观看</div>
      <div class="grid-note">184 x 64 CHARACTER GRID NEEDS LANDSCAPE</div>
    </div>
  </div>
  <!-- 离屏画布：字符网格的逐字符渲染目标（尺寸在 initGrid() 里按格子数设定） -->
  <canvas id="offCanvas" hidden></canvas>
  <!-- 音频：默认先试 music.mp3；若不存在会自动回退到 music.flac 等候选源 -->
  <audio id="music" src="music.mp3" preload="auto"></audio>

</body>
</html>
